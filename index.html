  {id:15,u:'unit-1',ch:'ch2',s:'isotopes',tp:'Radioactive Decay',df:'advanced',q:'When a Carbon-14 (¹⁴C) atom undergoes radioactive decay, what element does it transform into?',qv:'Khi nguyên tử Carbon-14 (¹⁴C) phân rã phóng xạ, nó biến đổi thành nguyên tố nào?',o:[{t:'Nitrogen-14 (¹⁴N)',tv:'Nitơ-14 (¹⁴N)',c:true},{t:'Carbon-12 (¹²C)',tv:'Carbon-12 (¹²C)',c:false},{t:'Oxygen-16 (¹⁶O)',tv:'Oxy-16 (¹⁶O)',c:false},{t:'Boron-11 (¹¹B)',tv:'Boron-11 (¹¹B)',c:false}],ex:'During ¹⁴C beta decay, a neutron emits an electron and turns into a proton, converting ¹⁴C (6p) into ¹⁴N (7p).',exv:'Trong phân rã beta của ¹⁴C, neutron phát ra electron và chuyển thành proton, biến ¹⁴C (6p) thành ¹⁴N (7p).'},
  {id:16,u:'unit-1',ch:'ch2',s:'isotopes',tp:'Medical Imaging',df:'intermediate',q:'PET scans rely on radioactively labeled glucose to detect cancer tumors based on which characteristic of cancer cells?',qv:'PET scan dựa vào glucose đánh dấu phóng xạ để phát hiện khối u ung thư dựa trên đặc tính nào của tế bào ung thư?',o:[{t:'High metabolic rate and elevated glucose consumption',tv:'Tốc độ chuyển hóa cao và tiêu thụ glucose tăng vọt',c:true},{t:'Lack of DNA in nucleus',tv:'Thiếu DNA trong hạt nhân',c:false},{t:'Inability to absorb water',tv:'Không thể hấp thụ nước',c:false},{t:'High concentration of sodium ions',tv:'Nồng độ ion natri cao',c:false}],ex:'Cancer cells metabolize glucose much faster than normal cells, accumulating radioactive tracer hot spots.',exv:'Tế bào ung thư chuyển hóa glucose nhanh hơn nhiều tế bào thường, tích tụ điểm nóng phóng xạ.'},
  {id:17,u:'unit-1',ch:'ch2',s:'isotopes',tp:'Radiometric Dating',df:'advanced',q:'An organic fossil is found to contain 25% (1/4) of its original ¹⁴C. How old is the fossil?',qv:'Một hóa thạch hữu cơ được tìm thấy chứa 25% (1/4) lượng ¹⁴C ban đầu. Hóa thạch này bao nhiêu tuổi?',o:[{t:'11,460 years (2 half-lives)',tv:'11.460 năm (2 lần bán rã)',c:true},{t:'5,730 years (1 half-life)',tv:'5.730 năm (1 lần bán rã)',c:false},{t:'17,190 years (3 half-lives)',tv:'17.190 năm (3 lần bán rã)',c:false},{t:'22,920 years (4 half-lives)',tv:'22.920 năm (4 lần bán rã)',c:false}],ex:'25% remaining = 2 half-lives elapsed = 2 × 5,730 = 11,460 years.',exv:'25% còn lại = 2 chu kỳ bán rã đã trôi qua = 2 × 5.730 = 11.460 năm.'},
  {id:18,u:'unit-1',ch:'ch2',s:'isotopes',tp:'Isotopes',df:'basic',q:'Which carbon isotope is stable and makes up ~99% of carbon in nature?',qv:'Đồng vị carbon nào ổn định và chiếm ~99% lượng carbon trong tự nhiên?',o:[{t:'Carbon-12 (¹²C)',tv:'Carbon-12 (¹²C)',c:true},{t:'Carbon-14 (¹⁴C)',tv:'Carbon-14 (¹⁴C)',c:false},{t:'Carbon-13 (¹³C)',tv:'Carbon-13 (¹³C)',c:false},{t:'Carbon-11 (¹¹C)',tv:'Carbon-11 (¹¹C)',c:false}],ex:'¹²C accounts for 99% of natural carbon, ¹³C accounts for ~1%, and ¹⁴C exists in trace amounts.',exv:'¹²C chiếm 99% carbon tự nhiên, ¹³C chiếm ~1%, và ¹⁴C tồn tại ở lượng vết phóng xạ.'},
  {id:19,u:'unit-1',ch:'ch2',s:'bonds',tp:'Covalent Bonds',df:'basic',q:'A covalent bond formed by sharing ONE pair of valence electrons is called a:',qv:'Liên kết cộng hóa trị hình thành bằng cách chia sẻ MỘT cặp electron hóa trị được gọi là:',o:[{t:'Single covalent bond',tv:'Liên kết cộng hóa trị đơn',c:true},{t:'Double covalent bond',tv:'Liên kết cộng hóa trị đôi',c:false},{t:'Ionic bond',tv:'Liên kết ion',c:false},{t:'Hydrogen bond',tv:'Liên kết hydro',c:false}],ex:'A single covalent bond (H—H) shares 1 electron pair (2 electrons total).',exv:'Liên kết cộng hóa trị đơn (H—H) chia sẻ 1 cặp electron (tổng cộng 2 electron).'},
  {id:20,u:'unit-1',ch:'ch2',s:'bonds',tp:'Electronegativity',df:'intermediate',q:'Why does Oxygen carry a partial negative charge (δ⁻) in a water molecule?',qv:'Tại sao Oxy mang điện tích âm từng phần (δ⁻) trong phân tử nước?',o:[{t:'Oxygen is more electronegative than Hydrogen and pulls shared electrons closer to itself',tv:'Oxy có độ âm điện cao hơn Hydro và kéo các electron chia sẻ về gần mình hơn',c:true},{t:'Oxygen gains a full electron from Hydrogen',tv:'Oxy nhận một electron hoàn chỉnh từ Hydro',c:false},{t:'Hydrogen loses all its protons',tv:'Hydro mất tất cả proton',c:false},{t:'Oxygen has fewer electrons than Hydrogen',tv:'Oxy có ít electron hơn Hydro',c:false}],ex:'Electronegativity is an atom\'s pull on shared electrons. Oxygen\'s high electronegativity creates δ⁻ on O and δ⁺ on H.',exv:'Độ âm điện là lực hút electron chia sẻ. Độ âm điện cao của Oxy tạo δ⁻ trên O và δ⁺ trên H.'},
  {id:21,u:'unit-1',ch:'ch2',s:'bonds',tp:'Ionic Bonds',df:'intermediate',q:'When Sodium (Na) reacts with Chlorine (Cl) to form NaCl, what happens to Sodium\'s valence electron?',qv:'Khi Natri (Na) phản ứng với Clo (Cl) để tạo NaCl, điều gì xảy ra với electron hóa trị của Natri?',o:[{t:'Sodium transfers 1 electron to Chlorine, becoming a positive cation (Na⁺)',tv:'Natri truyền 1 electron cho Clo, trở thành cation dương (Na⁺)',c:true},{t:'Sodium accepts 7 electrons from Chlorine',tv:'Natri nhận 7 electron từ Clo',c:false},{t:'Sodium shares 2 electrons equally with Chlorine',tv:'Natri chia sẻ đều 2 electron với Clo',c:false},{t:'Sodium converts its electron into a proton',tv:'Natri chuyển electron thành proton',c:false}],ex:'Na (2-8-1) loses 1e⁻ to form Na⁺; Cl (2-8-7) gains 1e⁻ to form Cl⁻. Opposite charges attract in an ionic bond.',exv:'Na (2-8-1) mất 1e⁻ tạo Na⁺; Cl (2-8-7) nhận 1e⁻ tạo Cl⁻. Điện tích đối lập hút nhau trong liên kết ion.'},
  {id:22,u:'unit-1',ch:'ch2',s:'bonds',tp:'Salts & Water',df:'advanced',q:'Why do ionic pharmaceutical drugs dissolve readily when ingested into body fluids?',qv:'Tại sao các thuốc dược phẩm dạng muối ion lại tan dễ dàng khi đi vào dịch cơ thể?',o:[{t:'Water molecules surround ions with hydration shells, weakening ionic bonds',tv:'Các phân tử nước bao quanh các ion bằng vỏ hydrat, làm yếu liên kết ion',c:true},{t:'Water molecules destroy the atomic nucleus of sodium',tv:'Phân tử nước phá hủy hạt nhân nguyên tử natri',c:false},{t:'Dry ionic crystals are weaker than dissolved salts',tv:'Tinh thể ion khô yếu hơn muối đã tan',c:false},{t:'Body fluids turn salts into nonpolar covalent bonds',tv:'Dịch cơ thể biến muối thành liên kết cộng hóa trị không cực',c:false}],ex:'In dry crystals, ionic bonds are strong; in water, hydration shells shield ions, allowing easy dissolution.',exv:'Trong tinh thể khô, liên kết ion rất mạnh; trong nước, vỏ hydrat che chắn ion, cho phép tan dễ dàng.'},
  {id:23,u:'unit-1',ch:'ch2',s:'bonds',tp:'Valence',df:'basic',q:'What is the valence (bonding capacity) of Nitrogen (atomic number 7)?',qv:'Hóa trị (khả năng liên kết) của Nitơ (số nguyên tử 7) là bao nhiêu?',o:[{t:'3',tv:'3',c:true},{t:'5',tv:'5',c:false},{t:'1',tv:'1',c:false},{t:'4',tv:'4',c:false}],ex:'Nitrogen has 5 valence electrons in shell 2, so it needs 3 more electrons to complete its octet (valence = 3).',exv:'Nitơ có 5 electron hóa trị ở lớp 2, nên cần thêm 3 electron để hoàn thiện bát tử (hóa trị = 3).'},
  {id:24,u:'unit-1',ch:'ch2',s:'bonds',tp:'Nonpolar Bonds',df:'intermediate',q:'Which of the following molecules contains a nonpolar covalent bond?',qv:'Phân tử nào sau đây chứa liên kết cộng hóa trị không cực?',o:[{t:'O₂ (Oxygen gas)',tv:'O₂ (Khí Oxy)',c:true},{t:'H₂O (Water)',tv:'H₂O (Nước)',c:false},{t:'NH₃ (Ammonia)',tv:'NH₃ (Ammonia)',c:false},{t:'NaCl (Table salt)',tv:'NaCl (Muối ăn)',c:false}],ex:'In O₂, two identical oxygen atoms share electrons equally due to equal electronegativity.',exv:'Trong O₂, hai nguyên tử oxy giống hệt chia sẻ electron đều nhau do độ âm điện bằng nhau.'},
  {id:25,u:'unit-1',ch:'ch2',s:'bonds',tp:'Anions & Cations',df:'basic',q:'An atom that has GAINED electrons and carries a negative electrical charge is called an:',qv:'Một nguyên tử đã NHẬN electron và mang điện tích âm được gọi là:',o:[{t:'Anion',tv:'Anion (ion âm)',c:true},{t:'Cation',tv:'Cation (ion dương)',c:false},{t:'Isotope',tv:'Đồng vị',c:false},{t:'Isomer',tv:'Đồng phân',c:false}],ex:'Anions are negatively charged ions (e.g., Cl⁻); Cations are positively charged ions (e.g., Na⁺).',exv:'Anion là ion mang điện âm (vd: Cl⁻); Cation là ion mang điện dương (vd: Na⁺).'},
  {id:26,u:'unit-1',ch:'ch2',s:'bonds',tp:'Electrolytes',df:'intermediate',q:'Which ions are major clinical electrolytes essential for human heart function and nerve impulse transmission?',qv:'Những ion nào là chất điện giải lâm sàng chính thiết yếu cho chức năng tim và truyền xung thần kinh ở người?',o:[{t:'Na⁺, K⁺, Ca²⁺, Cl⁻',tv:'Na⁺, K⁺, Ca²⁺, Cl⁻',c:true},{t:'Fe³⁺, Cu²⁺, Zn²⁺, Mn²⁺',tv:'Fe³⁺, Cu²⁺, Zn²⁺, Mn²⁺',c:false},{t:'U⁴⁺, Ra²⁺, Pu³⁺, Th⁴⁺',tv:'U⁴⁺, Ra²⁺, Pu³⁺, Th⁴⁺',c:false},{t:'He, Ne, Ar, Kr',tv:'He, Ne, Ar, Kr',c:false}],ex:'Electrolytes Na⁺, K⁺, Ca²⁺, Cl⁻ regulate membrane potential, muscle contraction, and cardiac rhythms.',exv:'Điện giải Na⁺, K⁺, Ca²⁺, Cl⁻ điều hòa điện thế màng, co cơ và nhịp tim.'},
  {id:27,u:'unit-1',ch:'ch2',s:'weak',tp:'Hydrogen Bonds',df:'basic',q:'A hydrogen bond is an attraction between:',qv:'Liên kết hydro là lực hút giữa:',o:[{t:'A partially positive hydrogen atom and a nearby electronegative atom (like O or N)',tv:'Hydro mang điện dương từng phần và nguyên tử âm điện gần đó (như O hoặc N)',c:true},{t:'Two full positive cations',tv:'Hai cation dương hoàn chỉnh',c:false},{t:'Two nonpolar carbon chains',tv:'Hai chuỗi carbon không cực',c:false},{t:'An electron and a neutron in the nucleus',tv:'Một electron và một neutron trong hạt nhân',c:false}],ex:'Hydrogen bonds form between δ⁺ H (covalently attached to O or N) and δ⁻ O or N on another molecule.',exv:'Liên kết hydro hình thành giữa δ⁺ H (gắn cộng hóa trị với O hoặc N) và δ⁻ O hoặc N ở phân tử khác.'},
  {id:28,u:'unit-1',ch:'ch2',s:'weak',tp:'Van der Waals',df:'intermediate',q:'What physical forces allow a gecko lizard to walk vertically up a smooth glass wall?',qv:'Lực vật lý nào cho phép con tắc kè đi thẳng đứng lên bức tường kính nhẵn?',o:[{t:'Cumulative Van der Waals interactions between toe hairs and wall molecules',tv:'Các tương tác Van der Waals tổng hợp giữa lông ngón chân và phân tử tường',c:true},{t:'Strong ionic bonds between gecko toes and glass',tv:'Liên kết ion mạnh giữa chân tắc kè và kính',c:false},{t:'Covalent sharing of electrons with glass',tv:'Chia sẻ electron cộng hóa trị với kính',c:false},{t:'Suction cups creating a complete vacuum',tv:'Cốc hút tạo chân không hoàn toàn',c:false}],ex:'Millions of microscopic setae on gecko feet maximize surface area, creating powerful cumulative Van der Waals forces.',exv:'Hàng triệu lông siêu nhỏ trên chân tắc kè tối đa hóa diện tích bề mặt, tạo lực Van der Waals tổng hợp mạnh mẽ.'},
  {id:29,u:'unit-1',ch:'ch2',s:'weak',tp:'Molecular Mimicry',df:'advanced',q:'Why does Morphine produce pain relief and euphoria similar to natural Endorphins in the human brain?',qv:'Tại sao Morphine lại gây giảm đau và hưng phấn tương tự Endorphin tự nhiên trong não người?',o:[{t:'Morphine shares a similar 3D molecular shape that fits into endorphin brain receptors',tv:'Morphine có cấu trúc hình dạng 3D tương tự vừa vặn vào thụ thể endorphin trong não',c:true},{t:'Morphine contains identical atomic elements as endorphins',tv:'Morphine chứa các nguyên tố giống hệt endorphin',c:false},{t:'Morphine stimulates brain cells to manufacture new endorphin genes',tv:'Morphine kích thích tế bào brain sản xuất gen endorphin mới',c:false},{t:'Morphine destroys pain nerves permanently',tv:'Morphine phá hủy dây thần kinh cảm giác đau vĩnh viễn',c:false}],ex:'Molecular mimicry: similar 3D shape allows morphine to bind endorphin receptors. Shape determines function.',exv:'Bắt chước phân tử: hình dạng 3D tương tự cho phép morphine liên kết thụ thể endorphin. Hình dạng quyết định chức năng.'},
  {id:30,u:'unit-1',ch:'ch2',s:'weak',tp:'Bond Angles',df:'intermediate',q:'What is the bond angle in a water molecule (H₂O) caused by orbital hybridization?',qv:'Góc liên kết trong phân tử nước (H₂O) do sự lai hóa quỹ đạo gây ra là bao nhiêu?',o:[{t:'104.5°',tv:'104,5°',c:true},{t:'109.5°',tv:'109,5°',c:false},{t:'90°',tv:'90°',c:false},{t:'180°',tv:'180°',c:false}],ex:'Water has a V-shape with 104.5° bond angle due to 2 bonding electron pairs and 2 lone pairs repelling each other.',exv:'Nước có hình chữ V với góc 104,5° do 2 cặp electron liên kết và 2 cặp đơn lẻ đẩy nhau.'},
  {id:31,u:'unit-1',ch:'ch2',s:'weak',tp:'Bond Strength Comparison',df:'intermediate',q:'Roughly how strong is an individual hydrogen bond compared to a covalent bond?',qv:'Xấp xỉ một liên kết hydro đơn lẻ mạnh bằng bao nhiêu so với liên kết cộng hóa trị?',o:[{t:'~1/20 as strong',tv:'Mạnh bằng ~1/20',c:true},{t:'10 times stronger',tv:'Mạnh hơn 10 lần',c:false},{t:'Equal strength',tv:'Mạnh bằng nhau',c:false},{t:'1/1,000 as strong',tv:'Mạnh bằng 1/1.000',c:false}],ex:'Hydrogen bonds are weak individually (~1/20 of covalent bond), but collectively provide high structural stability.',exv:'Liên kết hydro đơn lẻ yếu (~1/20 liên kết cộng hóa trị), nhưng tổng hợp lại mang độ ổn định cấu trúc cao.'},
  {id:32,u:'unit-1',ch:'ch2',s:'weak',tp:'Methane Geometry',df:'basic',q:'What 3D shape does Methane (CH₄) form when Carbon creates 4 single covalent bonds?',qv:'Hình dạng 3D nào được tạo thành bởi Metan (CH₄) khi Carbon tạo 4 liên kết cộng hóa trị đơn?',o:[{t:'Tetrahedron (109.5° angle)',tv:'Hình Tứ diện (góc 109,5°)',c:true},{t:'Flat linear chain (180° angle)',tv:'Chuỗi phẳng tuyến tính (góc 180°)',c:false},{t:'Right triangle (90° angle)',tv:'Tam giác vuông (góc 90°)',c:false},{t:'Sphere',tv:'Hình cầu',c:false}],ex:'Carbon\'s four sp³ hybrid orbitals point toward the corners of a regular tetrahedron with 109.5° bond angles.',exv:'Bốn quỹ đạo lai sp³ của Carbon hướng về các đỉnh của hình tứ diện đều với góc 109,5°.'},
  {id:33,u:'unit-1',ch:'ch2',s:'weak',tp:'Reversibility',df:'intermediate',q:'Why are weak noncovalent interactions vital for cell signaling and molecular recognition?',qv:'Tại sao các tương tác phi cộng hóa trị yếu lại sống còn đối với truyền tín hiệu tế bào và nhận diện phân tử?',o:[{t:'They allow molecules to bind temporarily and release reversibly after signaling',tv:'Chúng cho phép phân tử liên kết tạm thời và giải phóng thuận nghịch sau khi truyền tín hiệu',c:true},{t:'They lock molecules permanently together forever',tv:'Chúng khóa vĩnh viễn các phân tử lại với nhau',c:false},{t:'They prevent enzymes from functioning',tv:'Chúng ngăn cản enzyme hoạt động',c:false},{t:'They convert biological molecules into inorganic stone',tv:'Chúng biến phân tử sinh học thành đá vô cơ',c:false}],ex:'Reversible weak bonds enable signal molecules to bind receptors transiently and dissociate when response ends.',exv:'Liên kết yếu thuận nghịch cho phép phân tử tín hiệu gắn tạm thời vào thụ thể và tách ra khi đáp ứng kết thúc.'},
  {id:34,u:'unit-1',ch:'ch2',s:'weak',tp:'Pharmacology',df:'advanced',q:'In modern drug design, what key molecular feature must a drug candidate possess to inhibit a disease-causing enzyme?',qv:'Trong thiết kế thuốc hiện đại, đặc điểm phân tử chìa khóa nào mà ứng viên thuốc phải có để ức chế enzyme gây bệnh?',o:[{t:'3D shape and charge complementarity to the enzyme\'s active site',tv:'Tính tương thích hình dạng 3D và điện tích với trung tâm hoạt động của enzyme',c:true},{t:'Identical molecular mass as water',tv:'Khối lượng phân tử giống hệt nước',c:false},{t:'High radioactivity level',tv:'Mức độ phóng xạ cao',c:false},{t:'Inability to form hydrogen bonds',tv:'Không có khả năng tạo liên kết hydro',c:false}],ex:'Drug design requires structural fit like a key in a lock to selectively bind target proteins.',exv:'Thiết kế thuốc đòi hỏi sự vừa vặn cấu trúc như chìa khóa tra vào ổ để liên kết chọn lọc protein mục tiêu.'},
  {id:35,u:'unit-1',ch:'ch2',s:'reactions',tp:'Conservation of Matter',df:'basic',q:'What happens to matter in any chemical reaction?',qv:'Điều gì xảy ra với vật chất trong bất kỳ phản ứng hóa học nào?',o:[{t:'Matter is conserved: atoms are rearranged, never created or destroyed',tv:'Vật chất được bảo toàn: các nguyên tử được sắp xếp lại, không bao giờ tự tạo ra hay bị phá hủy',c:true},{t:'Reactant atoms are destroyed into pure energy',tv:'Nguyên tử phản ứng bị phá hủy thành năng lượng thuần túy',c:false},{t:'New elements are transmuted spontaneously',tv:'Các nguyên tố mới được biến đổi tự phát',c:false},{t:'Total mass increases by 50%',tv:'Tổng khối lượng tăng 50%',c:false}],ex:'Conservation of matter: chemical reactions break and reform bonds, maintaining total atom count.',exv:'Bảo toàn vật chất: phản ứng hóa học phá vỡ và tái tạo liên kết, duy trì tổng số nguyên tử.'},
  {id:36,u:'unit-1',ch:'ch3',s:'reactions',tp:'Photosynthesis',df:'basic',q:'What are the starting reactants of photosynthesis?',qv:'Các chất phản ứng ban đầu của quá trình quang hợp là gì?',o:[{t:'6CO₂ + 6H₂O (Carbon dioxide and Water)',tv:'6CO₂ + 6H₂O (Carbon dioxide và Nước)',c:true},{t:'C₆H₁₂O₆ + 6O₂ (Glucose and Oxygen)',tv:'C₆H₁₂O₆ + 6O₂ (Glucose và Oxy)',c:false},{t:'2H₂ + O₂',tv:'2H₂ + O₂',c:false},{t:'NH₃ + CH₄',tv:'NH₃ + CH₄',c:false}],ex:'Photosynthesis equation: 6CO₂ + 6H₂O + Sunlight → C₆H₁₂O₆ + 6O₂.',exv:'Phương trình quang hợp: 6CO₂ + 6H₂O + Ánh sáng → C₆H₁₂O₆ + 6O₂.'},
  {id:37,u:'unit-1',ch:'ch2',s:'reactions',tp:'Chemical Equilibrium',df:'intermediate',q:'What defines a chemical reaction at dynamic chemical equilibrium?',qv:'Điều gì định nghĩa một phản ứng hóa học đang ở trạng thái cân bằng hóa học động?',o:[{t:'Forward and reverse reaction rates are equal, keeping reactant/product concentrations constant',tv:'Tốc độ phản ứng thuận và nghịch bằng nhau, giữ nồng độ chất phản ứng/sản phẩm không đổi',c:true},{t:'All reactions stop completely',tv:'Tất cả các phản ứng dừng lại hoàn toàn',c:false},{t:'Reactants and products have 50-50 equal concentrations always',tv:'Chất phản ứng và sản phẩm luôn có nồng độ bằng nhau 50-50',c:false},{t:'Only the forward reaction continues',tv:'Chỉ có phản ứng thuận tiếp tục',c:false}],ex:'Dynamic equilibrium means forward rate = reverse rate; concentrations stay stable but reactions continue.',exv:'Cân bằng động có nghĩa tốc độ thuận = tốc độ nghịch; nồng độ ổn định nhưng phản ứng vẫn tiếp diễn.'},
  {id:38,u:'unit-1',ch:'ch2',s:'reactions',tp:'Reaction Rates',df:'intermediate',q:'How does increasing reactant concentration affect chemical reaction rate?',qv:'Tăng nồng độ chất phản ứng ảnh hưởng thế nào đến tốc độ phản ứng hóa học?',o:[{t:'Increases rate due to more frequent molecular collisions',tv:'Tăng tốc độ phản ứng do va chạm phân tử thường xuyên hơn',c:true},{t:'Slows down the reaction to zero',tv:'Làm chậm phản ứng về 0',c:false},{t:'Has no effect on reaction speed',tv:'Không có tác động đến tốc độ phản ứng',c:false},{t:'Reverses gravity',tv:'Đảo ngược trọng lực',c:false}],ex:'Higher reactant concentration increases the frequency of effective molecular collisions.',exv:'Nồng độ chất phản ứng cao hơn làm tăng tần suất va chạm phân tử hiệu quả.'},
  {id:39,u:'unit-1',ch:'ch2',s:'reactions',tp:'Reversibility',df:'intermediate',q:'Are chemical reactions in biological systems reversible?',qv:'Các phản ứng hóa học trong hệ thống sinh học có tính thuận nghịch không?',o:[{t:'Yes, all chemical reactions are theoretically reversible',tv:'Có, mọi phản ứng hóa học đều thuận nghịch về mặt lý thuyết',c:true},{t:'No, biological reactions only go one direction',tv:'Không, phản ứng sinh học chỉ đi theo một hướng',c:false},{t:'Only in dead tissue',tv:'Chỉ trong mô đã chết',c:false},{t:'Only reactions involving Gold',tv:'Chỉ các phản ứng liên quan đến Vàng',c:false}],ex:'Reversibility is a fundamental law of chemical reactions (e.g., carbonic acid dissociation).',exv:'Tính thuận nghịch là quy luật cơ bản của phản ứng hóa học (vd: sự phân ly axit carbonic).'},
  {id:40,u:'unit-1',ch:'ch2',s:'reactions',tp:'Metabolism',df:'advanced',q:'In metabolic pathways, how do cells prevent reactions from reaching static dead-end equilibrium?',qv:'Trong các con đường chuyển hóa, tế bào ngăn các phản ứng đạt đến cân bằng tĩnh bế tắc bằng cách nào?',o:[{t:'By continuously adding reactants and removing products in open pathways',tv:'Bằng cách liên tục bổ sung chất phản ứng và loại bỏ sản phẩm trong con đường mở',c:true},{t:'By lowering body temperature to 0°C',tv:'Bằng cách hạ nhiệt độ cơ thể xuống 0°C',c:false},{t:'By eliminating all water from cells',tv:'Bằng cách loại bỏ toàn bộ nước khỏi tế bào',c:false},{t:'By converting all proteins into fat',tv:'Bằng cách chuyển tất cả protein thành mỡ',c:false}],ex:'Living cells are open systems: products of one reaction become reactants for the next, preventing equilibrium death.',exv:'Tế bào sống là hệ thống mở: sản phẩm của phản ứng này thành chất phản ứng cho phản ứng sau, ngăn cái chết cân bằng.'},
  // --- CHAPTER 3: THE CHEMISTRY OF WATER (Questions 41-75) ---
  {id:41,u:'unit-1',ch:'ch3',s:'wstruct',tp:'Water Polarity',df:'basic',q:'Why is water (H₂O) classified as a polar molecule?',qv:'Tại sao nước (H₂O) được xếp loại là phân tử cực?',o:[{t:'Overall charge is unevenly distributed (δ⁻ on O, δ⁺ on H)',tv:'Điện tích tổng thể phân bố không đều (δ⁻ trên O, δ⁺ trên H)',c:true},{t:'It contains ionic bonds',tv:'Nó chứa liên kết ion',c:false},{t:'It exists only at the North Pole',tv:'Nó chỉ tồn tại ở Bắc Cực',c:false},{t:'It has 4 hydrogen atoms',tv:'Nó có 4 nguyên tử hydro',c:false}],ex:'Water\'s polar covalent bonds and V-shape cause unequal charge distribution.',exv:'Liên kết cộng hóa trị cực và hình chữ V của nước gây phân bố điện tích không đều.'},
  {id:42,u:'unit-1',ch:'ch3',s:'wstruct',tp:'H-bond Lifetime',df:'advanced',q:'In liquid water, roughly how long does an individual hydrogen bond last before breaking?',qv:'Trong nước lỏng, xấp xỉ một liên kết hydro đơn lẻ tồn tại bao lâu trước khi bị phá vỡ?',o:[{t:'A few trillionths of a second (10⁻¹² s)',tv:'Vài phần nghìn tỷ giây (10⁻¹² giây)',c:true},{t:'15 minutes',tv:'15 phút',c:false},{t:'1 hour',tv:'1 giờ',c:false},{t:'1 microsecond',tv:'1 microgiây',c:false}],ex:'H-bonds in liquid water are extremely transient (~picoseconds), constantly breaking and reforming.',exv:'Liên kết hydro trong nước lỏng rất thoáng qua (~picosecond), liên tục phá vỡ và tái tạo.'},
  {id:43,u:'unit-1',ch:'ch3',s:'wstruct',tp:'H-bond Capacity',df:'intermediate',q:'In ice or liquid water, up to how many hydrogen bonds can a single water molecule form?',qv:'Trong băng hoặc nước lỏng, một phân tử nước đơn lẻ có thể tạo tối đa bao nhiêu liên kết hydro?',o:[{t:'4',tv:'4',c:true},{t:'2',tv:'2',c:false},{t:'8',tv:'8',c:false},{t:'10',tv:'10',c:false}],ex:'Each water molecule can form up to 4 H-bonds (2 via oxygen lone pairs, 2 via hydrogen atoms).',exv:'Mỗi phân tử nước có thể tạo tối đa 4 liên kết H (2 qua cặp electron đơn của oxy, 2 qua nguyên tử hydro).'},
  {id:44,u:'unit-1',ch:'ch3',s:'wstruct',tp:'Water Properties',df:'basic',q:'What fundamental molecular interaction is responsible for ALL of water\'s unique life-supporting properties?',qv:'Tương tác phân tử cơ bản nào chịu trách nhiệm cho TẤT CẢ các tính chất duy trì sự sống độc đáo của nước?',o:[{t:'Hydrogen bonding network',tv:'Mạng lưới liên kết hydro',c:true},{t:'Radioactive decay',tv:'Phân rã phóng xạ',c:false},{t:'Triple covalent bonds',tv:'Liên kết cộng hóa trị ba',c:false},{t:'Gravitational pull',tv:'Lực hút hấp dẫn',c:false}],ex:'All unique properties (cohesion, high specific heat, ice floating, solvent power) trace back to H-bonding.',exv:'Tất cả tính chất độc đáo (kết dính, nhiệt dung riêng cao, băng nổi, tính dung môi) đều bắt nguồn từ liên kết H.'},
  {id:45,u:'unit-1',ch:'ch3',s:'wstruct',tp:'Water Geometry',df:'basic',q:'What is the geometry of a water molecule?',qv:'Hình học không gian của phân tử nước là gì?',o:[{t:'V-shaped bent molecule',tv:'Phân tử gấp khúc hình chữ V',c:true},{t:'Straight linear molecule',tv:'Phân tử tuyến tính thẳng',c:false},{t:'Square planar',tv:'Phẳng hình vuông',c:false},{t:'Cube',tv:'Hình lập phương',c:false}],ex:'Oxygen\'s 2 bonding pairs and 2 lone pairs create a distorted V-shape with 104.5° angle.',exv:'2 cặp liên kết và 2 cặp đơn của Oxy tạo hình chữ V méo với góc 104,5°.'},
  {id:46,u:'unit-1',ch:'ch3',s:'cohesion',tp:'Cohesion',df:'basic',q:'The tendency of water molecules to stick to OTHER water molecules via H-bonds is called:',qv:'Xu hướng các phân tử nước dính vào các phân tử nước KHÁC qua liên kết H được gọi là:',o:[{t:'Cohesion',tv:'Sự kết dính (Cohesion)',c:true},{t:'Adhesion',tv:'Sự bám dính (Adhesion)',c:false},{t:'Evaporation',tv:'Sự bay hơi',c:false},{t:'Ionization',tv:'Sự ion hóa',c:false}],ex:'Cohesion = water sticking to water; Adhesion = water sticking to other polar surfaces.',exv:'Kết dính = nước dính với nước; Bám dính = nước dính với bề mặt cực khác.'},
  {id:47,u:'unit-1',ch:'ch3',s:'cohesion',tp:'Surface Tension',df:'intermediate',q:'What enables water strider insects to walk across the surface of a pond without sinking?',qv:'Điều gì cho phép côn trùng nhện nước bước đi trên mặt nước ao mà không bị chìm?',o:[{t:'High surface tension created by cohesive hydrogen bonds',tv:'Sức căng bề mặt cao được tạo bởi liên kết hydro kết dính',c:true},{t:'High density of water',tv:'Mật độ nước cao',c:false},{t:'Low temperature of water',tv:'Nhiệt độ nước thấp',c:false},{t:'Hydrophobic skin on the water surface',tv:'Lớp da kỵ nước trên bề mặt nước',c:false}],ex:'At the air-water interface, H-bonds pull molecules downward and sideways, creating high surface tension.',exv:'Tại giao diện khí-nước, liên kết H kéo phân tử xuống và sang bên, tạo sức căng bề mặt cao.'},
  {id:48,u:'unit-1',ch:'ch3',s:'cohesion',tp:'Transpiration Pull',df:'advanced',q:'In 100-meter tall redwood trees, what role does ADHESION play in water transport?',qv:'Ở các cây hồng đao cao 100 mét, BÁM DÍNH đóng vai trò gì trong vận chuyển nước?',o:[{t:'Water molecules H-bond to hydrophilic xylem cell walls, counteracting gravity',tv:'Phân tử nước liên kết H với thành tế bào xylem thân nước, chống lại trọng lực',c:true},{t:'Water breaks down cell walls into sugar',tv:'Nước phá hủy thành tế bào thành đường',c:false},{t:'Water evaporates out of roots',tv:'Nước bay hơi khỏi rễ',c:false},{t:'Adhesion pushes water downward into soil',tv:'Bám dính đẩy nước xuống đất',c:false}],ex:'Adhesion (water-cell wall H-bonds) prevents water columns from falling down under gravity.',exv:'Bám dính (liên kết H nước-thành tế bào) ngăn cột nước bị kéo rơi xuống do trọng lực.'},
  {id:49,u:'unit-1',ch:'ch3',s:'cohesion',tp:'Transpiration Pull',df:'intermediate',q:'What primary physical force generates the upward pull of water from roots to leaves in tall plants?',qv:'Lực vật lý chính nào tạo ra lực kéo nước từ rễ lên lá ở cây cao?',o:[{t:'Transpiration (evaporation of water from leaf stomata)',tv:'Sự thoát hơi nước (bay hơi nước từ khí khổng lá)',c:true},{t:'Pumping action of a plant heart',tv:'Bơm của tim thực vật',c:false},{t:'Magnetic force from Earth\'s core',tv:'Lực từ trường từ lõi Trái đất',c:false},{t:'Active ATP transport in dead xylem',tv:'Vận chuyển ATP chủ động trong xylem đã chết',c:false}],ex:'Transpiration pull evaporates water at leaves, transmitting negative pressure down cohesive water columns.',exv:'Kéo thoát hơi nước bay hơi tại lá, truyền áp suất âm xuống cột nước kết dính.'},
  {id:50,u:'unit-1',ch:'ch3',s:'cohesion',tp:'Capillary Action',df:'intermediate',q:'Cohesion and adhesion together enable capillary action, which is vital in human medicine for:',qv:'Kết dính và bám dính cùng nhau tạo ra hoạt động mao dẫn, rất quan trọng trong y khoa để:',o:[{t:'Blood flow through narrow capillaries and tear film distribution on eyes',tv:'Dòng máu chảy qua các mao mạch hẹp và phân bố màng nước mắt trên mắt',c:true},{t:'Dissolving bone minerals',tv:'Hòa tan khoáng chất xương',c:false},{t:'Generating nerve electricity',tv:'Tạo ra điện thần kinh',c:false},{t:'Destroying bacteria',tv:'Tiêu diệt vi khuẩn',c:false}],ex:'Capillary action allows blood fluids to travel through narrow vessels without mechanical pumps.',exv:'Hoạt động mao dẫn cho phép dịch máu di chuyển qua mạch hẹp mà không cần bơm cơ học.'},
  {id:51,u:'unit-1',ch:'ch3',s:'cohesion',tp:'Meniscus',df:'basic',q:'Why does water form a concave meniscus curve when filled in a glass graduated cylinder?',qv:'Tại sao nước lại tạo đường cong khum lõm (meniscus) khi đổ vào ống đong bằng kính?',o:[{t:'Adhesion of water to glass is stronger than cohesion between water molecules',tv:'Lực bám dính của nước với kính mạnh hơn lực kết dính giữa các phân tử nước',c:true},{t:'Cohesion is stronger than adhesion',tv:'Lực kết dính mạnh hơn lực bám dính',c:false},{t:'Gravity pulls the center upward',tv:'Trọng lực kéo tâm lên trên',c:false},{t:'Glass is hydrophobic',tv:'Kính là chất kỵ nước',c:false}],ex:'Water adheres strongly to polar silicates in glass, climbing up the container edges.',exv:'Nước bám dính mạnh vào silicate cực trong kính, bò lên các rìa thành bình.'},
  {id:52,u:'unit-1',ch:'ch3',s:'temp',tp:'Specific Heat',df:'basic',q:'What is the specific heat of liquid water?',qv:'Nhiệt dung riêng của nước lỏng là bao nhiêu?',o:[{t:'1 cal/(g·°C)',tv:'1 cal/(g·°C)',c:true},{t:'0.1 cal/(g·°C)',tv:'0,1 cal/(g·°C)',c:false},{t:'100 cal/(g·°C)',tv:'100 cal/(g·°C)',c:false},{t:'0.6 cal/(g·°C)',tv:'0,6 cal/(g·°C)',c:false}],ex:'Water has an unusually high specific heat of 1 cal/g·°C (4.184 J/g·°C).',exv:'Nước có nhiệt dung riêng cao bất thường 1 cal/g·°C (4,184 J/g·°C).'},
  {id:53,u:'unit-1',ch:'ch3',s:'temp',tp:'Specific Heat Mechanism',df:'intermediate',q:'WHY does water resist temperature changes so effectively?',qv:'TẠI SAO nước chống lại sự thay đổi nhiệt độ một cách hiệu quả như vậy?',o:[{t:'Heat energy must first break hydrogen bonds before water molecules can speed up',tv:'Năng lượng nhiệt phải phá vỡ các liên kết hydro trước khi các phân tử nước có thể tăng tốc',c:true},{t:'Water molecules cannot absorb thermal energy',tv:'Phân tử nước không thể hấp thụ năng lượng nhiệt',c:false},{t:'Water turns into solid ice instantly',tv:'Nước biến thành băng rắn ngay lập tức',c:false},{t:'Water atoms are immovable',tv:'Nguyên tử nước không thể di chuyển',c:false}],ex:'Absorbed heat is used to disrupt H-bonds rather than increase kinetic motion (temperature).',exv:'Nhiệt hấp thụ được dùng để phá H-bond thay vì làm tăng chuyển động động năng (nhiệt độ).'},
  {id:54,u:'unit-1',ch:'ch3',s:'temp',tp:'Climate Moderation',df:'intermediate',q:'How do large oceans moderate coastal climates during warm summer months?',qv:'Các đại dương lớn điều hòa khí hậu ven biển trong các tháng mùa hè nóng nực như thế nào?',o:[{t:'Oceans absorb massive amounts of solar heat with only a slight rise in temperature',tv:'Đại dương hấp thụ lượng nhiệt mặt trời khổng lồ mà chỉ tăng nhẹ nhiệt độ',c:true},{t:'Oceans freeze solid in summer',tv:'Đại dương đóng băng rắn vào mùa hè',c:false},{t:'Oceans reflect 100% of sunlight into space',tv:'Đại dương phản xạ 100% ánh sáng vào vũ trụ',c:false},{t:'Oceans release methane gas',tv:'Đại dương giải phóng khí methane',c:false}],ex:'High specific heat allows oceans to store vast solar thermal energy, keeping coastal regions cool.',exv:'Nhiệt dung riêng cao cho phép đại dương tích trữ năng lượng nhiệt mặt trời lớn, giữ vùng ven biển mát mẻ.'},
  {id:55,u:'unit-1',ch:'ch3',s:'temp',tp:'Heat of Vaporization',df:'intermediate',q:'How much heat energy is required to evaporate 1 gram of liquid water at 25°C?',qv:'Cần bao nhiêu năng lượng nhiệt để làm bay hơi 1 gram nước lỏng ở 25°C?',o:[{t:'580 calories',tv:'580 calorie',c:true},{t:'1 calorie',tv:'1 calorie',c:false},{t:'100 calories',tv:'100 calorie',c:false},{t:'1,000 calories',tv:'1.000 calorie',c:false}],ex:'Water\'s high heat of vaporization (580 cal/g) is nearly double that of alcohol or ammonia.',exv:'Nhiệt hóa hơi cao của nước (580 cal/g) gần gấp đôi so với alcohol hoặc ammonia.'},
  {id:56,u:'unit-1',ch:'ch3',s:'temp',tp:'Evaporative Cooling',df:'basic',q:'Why does sweating cool down the human body on a hot day?',qv:'Tại sao đổ mồ hôi lại làm mát cơ thể người trong ngày nóng?',o:[{t:'The fastest ("hottest") water molecules evaporate off skin, lowering average kinetic energy of remaining liquid',tv:'Các phân tử nước nhanh nhất ("nóng nhất") bay hơi khỏi da, làm giảm động năng trung bình của chất lỏng còn lại',c:true},{t:'Sweat turns into cold ice on skin',tv:'Mồ hôi biến thành băng lạnh trên da',c:false},{t:'Sweat absorbs oxygen from air',tv:'Mồ hôi hấp thụ oxy từ không khí',c:false},{t:'Sweat blocks blood circulation',tv:'Mồ hôi chặn tuần hoàn máu',c:false}],ex:'Evaporative cooling leaves cooler molecules behind as energetic surface molecules depart as gas.',exv:'Làm mát bay hơi để lại các phân tử mát hơn sau khi phân tử bề mặt giàu năng lượng rời đi dưới dạng khí.'},
  {id:57,u:'unit-1',ch:'ch3',s:'temp',tp:'Calorie Definition',df:'basic',q:'One kilocalorie (1 kcal, or food Calorie) is defined as the heat required to raise the temperature of:',qv:'Một kilocalorie (1 kcal, hoặc Calorie thực phẩm) được định nghĩa là nhiệt lượng cần để nâng nhiệt độ của:',o:[{t:'1 kilogram of water by 1°C',tv:'1 kilogram nước lên 1°C',c:true},{t:'1 gram of water by 1°C',tv:'1 gram nước lên 1°C',c:false},{t:'100 grams of iron by 10°C',tv:'100 gram sắt lên 10°C',c:false},{t:'1 liter of alcohol by 100°C',tv:'1 lít alcohol lên 100°C',c:false}],ex:'1 kcal = 1,000 calories = heat to raise 1 kg of water by 1°C.',exv:'1 kcal = 1.000 cal = nhiệt lượng nâng 1 kg nước lên 1°C.'},
  {id:58,u:'unit-1',ch:'ch3',s:'ice',tp:'Density Anomaly',df:'basic',q:'At what temperature does liquid water reach its MAXIMUM density?',qv:'Ở nhiệt độ nào nước lỏng đạt mật độ (khối lượng riêng) TỐI ĐA?',o:[{t:'4°C',tv:'4°C',c:true},{t:'0°C',tv:'0°C',c:false},{t:'100°C',tv:'100°C',c:false},{t:'−4°C',tv:'−4°C',c:false}],ex:'Water is densest at 4°C. Below 4°C, H-bonds begin expanding molecules into a lattice.',exv:'Nước đặc nhất ở 4°C. Dưới 4°C, liên kết H bắt đầu mở rộng phân tử thành mạng lưới.'},
  {id:59,u:'unit-1',ch:'ch3',s:'ice',tp:'Crystalline Lattice',df:'intermediate',q:'Why is solid ice LESS dense than liquid water at 0°C?',qv:'Tại sao băng rắn lại KÉM ĐẶC HƠN nước lỏng ở 0°C?',o:[{t:'Hydrogen bonds lock molecules into a rigid hexagonal crystalline lattice, holding them farther apart',tv:'Các liên kết hydro khóa phân tử vào mạng tinh thể lục giác cứng, giữ chúng cách xa nhau hơn',c:true},{t:'Ice contains heavy lead atoms',tv:'Băng chứa nguyên tử chì nặng',c:false},{t:'Liquid water molecules lose their hydrogen atoms',tv:'Các phân tử nước lỏng mất nguyên tử hydro',c:false},{t:'Ice absorbs helium from the atmosphere',tv:'Băng hấp thụ heli từ khí quyển',c:false}],ex:'Ice crystalline lattice holds molecules at "arm\'s length", making ice ~10% less dense than 4°C water.',exv:'Mạng tinh thể băng giữ phân tử cách xa nhau, làm băng kém đặc hơn ~10% so với nước ở 4°C.'},
  {id:60,u:'unit-1',ch:'ch3',s:'ice',tp:'Aquatic Life',df:'intermediate',q:'What ecological disaster would occur if ice were DENSER than liquid water and sank?',qv:'Thảm họa sinh thái nào sẽ xảy ra nếu băng ĐẶC HƠN nước lỏng và chìm xuống?',o:[{t:'Ponds, lakes, and oceans would freeze solid from bottom to top, killing aquatic life',tv:'Ao, hồ và đại dương sẽ đóng băng rắn từ đáy lên đỉnh, tiêu diệt sinh vật dưới nước',c:true},{t:'Fish would fly into space',tv:'Cá sẽ bay vào vũ trụ',c:false},{t:'Oceans would evaporate instantly',tv:'Đại dương sẽ bay hơi ngay lập tức',c:false},{t:'Water would turn into gasoline',tv:'Nước sẽ biến thành xăng',c:false}],ex:'Floating surface ice insulates underlying liquid water, allowing marine organisms to survive winter.',exv:'Băng mặt nổi cách nhiệt cho nước lỏng bên dưới, cho phép sinh vật biển sống qua mùa đông.'},
  {id:61,u:'unit-1',ch:'ch3',s:'ice',tp:'Climate Change',df:'intermediate',q:'Since 1961, average Arctic air temperatures have risen by how much due to climate change?',qv:'Từ năm 1961, nhiệt độ không khí trung bình ở Bắc Cực đã tăng bao nhiêu do biến đổi khí hậu?',o:[{t:'2.2°C',tv:'2,2°C',c:true},{t:'0.1°C',tv:'0,1°C',c:false},{t:'10°C',tv:'10°C',c:false},{t:'50°C',tv:'50°C',c:false}],ex:'Arctic temperatures rose 2.2°C since 1961, rapidly shrinking polar ice caps.',exv:'Nhiệt độ Bắc Cực tăng 2,2°C từ năm 1961, suy giảm nhanh chóng các chỏm băng cực.'},
  {id:62,u:'unit-1',ch:'ch3',s:'ice',tp:'Arctic Wildlife',df:'advanced',q:'How does declining sea ice impact Pacific walruses and polar bears in the Arctic?',qv:'Băng biển suy giảm ảnh hưởng thế nào đến hải mã Thái Bình Dương và gấu trắng ở Bắc Cực?',o:[{t:'Loss of ice hunting platforms forces walruses onto overcrowded land stampedes and starves polar bears',tv:'Mất nền tảng băng săn mồi ép hải mã lên đất liền quá đông gây giẫm đạp và làm gấu trắng đói',c:true},{t:'It increases their food supply 10-fold',tv:'Nó làm tăng nguồn thức ăn của chúng gấp 10 lần',c:false},{t:'It causes them to migrate to Antarctica',tv:'Nó khiến chúng di cư sang Nam Cực',c:false},{t:'It turns polar bears into herbivores',tv:'Nó biến gấu trắng thành động vật ăn cỏ',c:false}],ex:'Loss of ice platforms degrades feeding grounds, causing cub mortality and overcrowding.',exv:'Mất nền tảng băng suy thoái bãi săn mồi, gây tử vong ở con nhỏ và quá tải.'},
  {id:63,u:'unit-1',ch:'ch3',s:'solvent',tp:'Hydration Shell',df:'intermediate',q:'What structure forms around a dissolved Na⁺ cation in aqueous solution?',qv:'Cấu trúc nào hình thành quanh cation Na⁺ đã tan trong dung dịch nước?',o:[{t:'A hydration shell of water molecules with their partial negative Oxygen atoms pointing inward toward Na⁺',tv:'Lớp vỏ hydrat các phân tử nước với nguyên tử Oxy âm điện từng phần hướng vào trong về phía Na⁺',c:true},{t:'A shell of hydrogen gas',tv:'Lớp vỏ khí hydro',c:false},{t:'A solid ring of carbon atoms',tv:'Vòng rắn các nguyên tử carbon',c:false},{t:'A bubble of oil',tv:'Bong bóng dầu',c:false}],ex:'Na⁺ (+) attracts δ⁻ Oxygen of water molecules; Cl⁻ (−) attracts δ⁺ Hydrogen.',exv:'Na⁺ (+) hút δ⁻ Oxy của nước; Cl⁻ (−) hút δ⁺ Hydro.'},
  {id:64,u:'unit-1',ch:'ch3',s:'solvent',tp:'Hydrophobic vs Hydrophilic',df:'basic',q:'Nonpolar substances like vegetable oil that repel water are classified as:',qv:'Các chất không cực như dầu thực vật đẩy nước được xếp loại là:',o:[{t:'Hydrophobic ("water-fearing")',tv:'Kỵ nước (Hydrophobic / ghét nước)',c:true},{t:'Hydrophilic ("water-loving")',tv:'Thân nước (Hydrophilic / yêu nước)',c:false},{t:'Ionic salts',tv:'Muối ion',c:false},{t:'Buffers',tv:'Chất đệm',c:false}],ex:'Hydrophobic molecules are nonpolar/nonionic and cannot form H-bonds with water.',exv:'Phân tử kỵ nước là chất không cực/không ion và không thể tạo liên kết H với nước.'},
  {id:65,u:'unit-1',ch:'ch3',s:'solvent',tp:'Hydrophilic Property',df:'intermediate',q:'Why is cotton cloth highly hydrophilic (absorbs water) yet does NOT dissolve in your washing machine?',qv:'Tại sao vải bông rất thân nước (hấp thụ nước) nhưng KHÔNG bị hòa tan trong máy giặt?',o:[{t:'Cellulose molecules in cotton are giant polymers too large to dissolve despite forming H-bonds',tv:'Các phân tử cellulose trong bông là polymer khổng lồ quá lớn để tan dù tạo liên kết H',c:true},{t:'Cotton is coated in hydrophobic wax',tv:'Bông được bọc trong sáp kỵ nước',c:false},{t:'Washing machine water is nonpolar',tv:'Nước máy giặt là chất không cực',c:false},{t:'Cotton contains ionic sodium bonds',tv:'Bông chứa liên kết natri ion',c:false}],ex:'Cotton cellulose has abundant polar —OH groups that H-bond with water, but its giant molecular size prevents dissolution.',exv:'Cellulose của bông có nhiều nhóm —OH cực tạo liên kết H với nước, nhưng kích thước phân tử khổng lồ ngăn sự hòa tan.'},
  {id:66,u:'unit-1',ch:'ch3',s:'solvent',tp:'Molarity',df:'intermediate',q:'What is Molarity (M)?',qv:'Nồng độ Mol (Molarity - M) là gì?',o:[{t:'The number of moles of solute per liter of solution',tv:'Số mol chất tan trên mỗi lít dung dịch',c:true},{t:'The grams of water per kilogram of salt',tv:'Gram nước trên kg muối',c:false},{t:'The number of atoms in 1 gram of gold',tv:'Số nguyên tử trong 1 gram vàng',c:false},{t:'The temperature of a solution',tv:'Nhiệt độ của dung dịch',c:false}],ex:'Molarity (M) = moles of solute / liters of solution.',exv:'Nồng độ Mol (M) = số mol chất tan / lít dung dịch.'},
  {id:67,u:'unit-1',ch:'ch3',s:'solvent',tp:'Avogadro Number',df:'basic',q:'How many individual molecules are in 1 mole of any substance?',qv:'Có bao nhiêu phân tử đơn lẻ trong 1 mol của bất kỳ chất nào?',o:[{t:'6.02 × 10²³ (Avogadro\'s number)',tv:'6,02 × 10²³ (Số Avogadro)',c:true},{t:'1,000',tv:'1.000',c:false},{t:'92',tv:'92',c:false},{t:'10⁶',tv:'10⁶',c:false}],ex:'1 mole = 6.02 × 10²³ molecules (Avogadro\'s number).',exv:'1 mol = 6,02 × 10²³ phân tử (số Avogadro).'},
  {id:68,u:'unit-1',ch:'ch3',s:'solvent',tp:'Molecular Mass',df:'intermediate',q:'Sucrose has molecular formula C₁₂H₂₂O₁₁. What is its molecular mass in daltons? (C=12, H=1, O=16)',qv:'Sucrose có công thức phân tử C₁₂H₂₂O₁₁. Khối lượng phân tử của nó là bao nhiêu dalton? (C=12, H=1, O=16)',o:[{t:'342 daltons',tv:'342 dalton',c:true},{t:'180 daltons',tv:'180 dalton',c:false},{t:'100 daltons',tv:'100 dalton',c:false},{t:'500 daltons',tv:'500 dalton',c:false}],ex:'(12×12) + (22×1) + (11×16) = 144 + 22 + 176 = 342 daltons. 1 mol sucrose = 342 g.',exv:'(12×12) + (22×1) + (11×16) = 144 + 22 + 176 = 342 dalton. 1 mol sucrose = 342 g.'},
  {id:69,u:'unit-1',ch:'ch3',s:'acid',tp:'pH Definition',df:'basic',q:'What is the mathematical formula for pH?',qv:'Công thức toán học tính pH là gì?',o:[{t:'pH = −log₁₀[H⁺]',tv:'pH = −log₁₀[H⁺]',c:true},{t:'pH = [H⁺] × [OH⁻]',tv:'pH = [H⁺] × [OH⁻]',c:false},{t:'pH = 14 + [H⁺]',tv:'pH = 14 + [H⁺]',c:false},{t:'pH = ln(H₂O)',tv:'pH = ln(H₂O)',c:false}],ex:'pH is defined as the negative logarithm (base 10) of hydrogen ion concentration.',exv:'pH được định nghĩa là logarit âm (cơ số 10) của nồng độ ion hydro.'},
  {id:70,u:'unit-1',ch:'ch3',s:'acid',tp:'pH Change Magnitude',df:'intermediate',q:'A solution at pH 3 is how many times more acidic than a solution at pH 6?',qv:'Một dung dịch ở pH 3 có độ axit gấp bao nhiêu lần so với dung dịch ở pH 6?',o:[{t:'1,000 times more acidic',tv:'Axit hơn 1.000 lần',c:true},{t:'3 times more acidic',tv:'Axit hơn 3 lần',c:false},{t:'30 times more acidic',tv:'Axit hơn 30 lần',c:false},{t:'100 times more acidic',tv:'Axit hơn 100 lần',c:false}],ex:'Each pH unit represents a 10-fold change in [H⁺]. pH 3 to pH 6 = 10 × 10 × 10 = 1,000-fold difference.',exv:'Mỗi đơn vị pH đại diện cho sự thay đổi 10 lần [H⁺]. pH 3 đến pH 6 = 10 × 10 × 10 = khác biệt 1.000 lần.'},
  {id:71,u:'unit-1',ch:'ch3',s:'acid',tp:'Blood Buffer',df:'advanced',q:'Which chemical buffer system maintains human blood pH within the narrow survival range of 7.35–7.45?',qv:'Hệ đệm hóa học nào duy trì pH máu người trong khoảng sống còn hẹp 7,35–7,45?',o:[{t:'Carbonic acid–bicarbonate buffer system (H₂CO₃ ⇌ HCO₃⁻ + H⁺)',tv:'Hệ đệm carbonic acid–bicarbonate (H₂CO₃ ⇌ HCO₃⁻ + H⁺)',c:true},{t:'Hydrochloric acid–sodium buffer',tv:'Hệ đệm hydrochloric acid–natri',c:false},{t:'Pure water buffer',tv:'Hệ đệm nước tinh khiết',c:false},{t:'Sulfuric acid buffer',tv:'Hệ đệm axit sulfuric',c:false}],ex:'H₂CO₃ (weak acid) donates H⁺ when pH rises; HCO₃⁻ (weak base) accepts H⁺ when pH drops.',exv:'H₂CO₃ (axit yếu) cho H⁺ khi pH tăng; HCO₃⁻ (bazơ yếu) nhận H⁺ khi pH giảm.'},
  {id:72,u:'unit-1',ch:'ch3',s:'acid',tp:'Blood pH Limits',df:'advanced',q:'A patient\'s blood pH drops below 7.0 or rises above 7.8. What is the physiological outcome?',qv:'pH máu của một bệnh nhân giảm xuống dưới 7,0 hoặc tăng lên trên 7,8. Kết quả sinh lý là gì?',o:[{t:'Lethal — a human cannot survive for more than a few minutes outside pH 7.0–7.8',tv:'Tử vong — con người không thể sống sót quá vài phút ngoài khoảng pH 7,0–7,8',c:true},{t:'Normal health',tv:'Sức khỏe bình thường',c:false},{t:'Increased muscle strength',tv:'Tăng sức mạnh cơ bắp',c:false},{t:'Lower heart rate without symptoms',tv:'Giảm nhịp tim không triệu chứng',c:false}],ex:'Severe acidosis (pH < 7.0) or alkalosis (pH > 7.8) denatures proteins and causes cell death.',exv:'Nhiễm toan nặng (pH < 7,0) hoặc nhiễm kiềm (pH > 7,8) biến tính protein và gây chết tế bào.'},
  {id:73,u:'unit-1',ch:'ch3',s:'acid',tp:'Ocean Acidification',df:'intermediate',q:'What chemical reaction causes Ocean Acidification when excess atmospheric CO₂ dissolves in seawater?',qv:'Phản ứng hóa học nào gây ra Axit hóa Đại dương khi CO₂ khí quyển dư thừa hòa tan vào nước biển?',o:[{t:'CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻ (extra H⁺ reduces available CO₃²⁻ for coral reefs)',tv:'CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻ (H⁺ dư làm giảm CO₃²⁻ cho rạn san hô)',c:true},{t:'CO₂ turns water into liquid gold',tv:'CO₂ biến nước thành vàng lỏng',c:false},{t:'CO₂ absorbs all salt ions',tv:'CO₂ hấp thụ tất cả ion muối',c:false},{t:'CO₂ produces oxygen gas in deep ocean',tv:'CO₂ tạo ra khí oxy ở đại dương sâu',c:false}],ex:'Ocean acidification reduces carbonate ion (CO₃²⁻) concentration needed by corals and shellfish for calcification.',exv:'Axit hóa đại dương làm giảm nồng độ ion carbonate (CO₃²⁻) cần bởi san hô và động vật thân mềm để vôi hóa.'},
  {id:74,u:'unit-1',ch:'ch3',s:'acid',tp:'Acids & Bases',df:'basic',q:'A substance that INCREASES the hydrogen ion concentration [H⁺] of a solution is a(n):',qv:'Một chất làm TĂNG nồng độ ion hydro [H⁺] của dung dịch là:',o:[{t:'Acid',tv:'Axit',c:true},{t:'Base',tv:'Bazơ',c:false},{t:'Buffer',tv:'Chất đệm',c:false},{t:'Hydrocarbon',tv:'Hydrocarbon',c:false}],ex:'Acids donate H⁺ ions (e.g., HCl → H⁺ + Cl⁻); Bases decrease H⁺ ions.',exv:'Axit cho ion H⁺ (vd: HCl → H⁺ + Cl⁻); Bazơ làm giảm ion H⁺.'},
  {id:75,u:'unit-1',ch:'ch3',s:'acid',tp:'Neutral Water',df:'basic',q:'In pure neutral water at 25°C, what are the concentrations of [H⁺] and [OH⁻]?',qv:'Trong nước trung tính tinh khiết ở 25°C, nồng độ của [H⁺] và [OH⁻] là bao nhiêu?',o:[{t:'[H⁺] = [OH⁻] = 10⁻⁷ M (pH = 7)',tv:'[H⁺] = [OH⁻] = 10⁻⁷ M (pH = 7)',c:true},{t:'[H⁺] = 1 M, [OH⁻] = 0 M',tv:'[H⁺] = 1 M, [OH⁻] = 0 M',c:false},{t:'[H⁺] = 10⁻¹⁴ M, [OH⁻] = 10⁻¹⁴ M',tv:'[H⁺] = 10⁻¹⁴ M, [OH⁻] = 10⁻¹⁴ M',c:false},{t:'[H⁺] = 0 M, [OH⁻] = 0 M',tv:'[H⁺] = 0 M, [OH⁻] = 0 M',c:false}],ex:'In pure water at 25°C, [H⁺] × [OH⁻] = 10⁻¹⁴ M²; [H⁺] = [OH⁻] = 10⁻⁷ M.',exv:'Trong nước tinh khiết ở 25°C, [H⁺] × [OH⁻] = 10⁻¹⁴ M²; [H⁺] = [OH⁻] = 10⁻⁷ M.'},

  {id:76,u:'unit-1',ch:'ch4',s:'org',tp:'Miller Experiment',df:'intermediate',q:'What did Stanley Miller\'s famous 1953 laboratory experiment demonstrate about the origin of life?',qv:'Thí nghiệm phòng thí nghiệm nổi tiếng năm 1953 của Stanley Miller đã chứng minh điều gì về nguồn gốc sự sống?',o:[{t:'Complex organic molecules (amino acids) can form abiotically under simulated early Earth conditions',tv:'Các phân tử hữu cơ phức tạp (axit amin) có thể hình thành vô sinh trong điều kiện Trái đất sơ khai mô phỏng',c:true},{t:'Living bacterial cells generate spontaneously from mud',tv:'Tế bào vi khuẩn sống tự phát sinh từ bùn',c:false},{t:'DNA was created by volcanic lava',tv:'DNA được tạo ra bởi dung nham núi lửa',c:false},{t:'Proteins cannot exist without oxygen gas',tv:'Protein không thể tồn tại nếu không có khí oxy',c:false}],ex:'Miller demonstrated abiotic synthesis of organic compounds from CH₄, NH₃, H₂O, H₂ and electrical sparks.',exv:'Miller chứng minh sự tổng hợp vô sinh hợp chất hữu cơ từ CH₄, NH₃, H₂O, H₂ và tia lửa điện.'},
  {id:77,u:'unit-1',ch:'ch4',s:'org',tp:'Miller Reactants',df:'advanced',q:'Which mixture of gases did Stanley Miller use to simulate early Earth\'s reducing atmosphere in 1953?',qv:'Hỗn hợp khí nào Stanley Miller đã sử dụng để mô phỏng khí quyển khử của Trái đất sơ khai năm 1953?',o:[{t:'Methane (CH₄), Ammonia (NH₃), Water vapor (H₂O), Hydrogen gas (H₂)',tv:'Methane (CH₄), Ammonia (NH₃), Hơi nước (H₂O), Khí Hydro (H₂)',c:true},{t:'Pure Oxygen (O₂), Nitrogen gas (N₂), Carbon dioxide (CO₂)',tv:'Oxy tinh khiết (O₂), Khí Nitơ (N₂), Carbon dioxide (CO₂)',c:false},{t:'Helium (He), Argon (Ar), Ozone (O₃)',tv:'Heli (He), Argon (Ar), Ozone (O₃)',c:false},{t:'Chlorine gas (Cl₂), Fluorine (F₂), Sulfur dioxide (SO₂)',tv:'Khí Clo (Cl₂), Flo (F₂), Sulfur dioxide (SO₂)',c:false}],ex:'Miller\'s apparatus contained CH₄, NH₃, H₂O, and H₂ sparked by electrodes simulating lightning.',exv:'Thiết bị của Miller chứa CH₄, NH₃, H₂O, và H₂ được phóng điện bởi điện cực mô phỏng sấm sét.'},
  {id:78,u:'unit-1',ch:'ch4',s:'org',tp:'Carbon Versatility',df:'basic',q:'Why is Carbon uniquely suited to serve as the backbone of biological macromolecules?',qv:'Tại sao Carbon lại phù hợp một cách độc đáo để làm xương sống của các đại phân tử sinh học?',o:[{t:'It has 4 valence electrons and can form 4 covalent bonds in up to 4 directions',tv:'Nó có 4 electron hóa trị và có thể tạo 4 liên kết cộng hóa trị theo tối đa 4 hướng',c:true},{t:'It is the heaviest element in the periodic table',tv:'Nó là nguyên tố nặng nhất trong bảng tuần hoàn',c:false},{t:'It dissolves in gold',tv:'Nó hòa tan trong vàng',c:false},{t:'It forms only ionic bonds',tv:'Nó chỉ tạo liên kết ion',c:false}],ex:'Tetravalence allows carbon to construct complex chains, branches, and ring structures.',exv:'Hóa trị 4 cho phép carbon xây dựng các chuỗi, nhánh và cấu trúc vòng phức tạp.'},
  {id:79,u:'unit-1',ch:'ch4',s:'org',tp:'Mars Organic Evidence',df:'intermediate',q:'In 2018, NASA\'s Curiosity rover discovered organic carbon compounds on Mars in which location?',qv:'Năm 2018, xe tự hành Curiosity của NASA đã phát hiện các hợp chất carbon hữu cơ trên sao Hỏa ở vị trí nào?',o:[{t:'3.5-billion-year-old mudstone in Gale Crater',tv:'Đá bùn 3,5 tỷ năm tuổi tại hố va chạm Gale',c:true},{t:'Inside a active Martian volcano',tv:'Bên trong một núi lửa đang hoạt động trên sao Hỏa',c:false},{t:'In frozen ice rings around Saturn',tv:'Trong vành đai băng quanh Sao Thổ',c:false},{t:'On the sun\'s surface',tv:'Trên bề mặt mặt trời',c:false}],ex:'Curiosity found organic molecules preserved in 3.5-billion-year-old Martian mudstone sediment.',exv:'Curiosity tìm thấy phân tử hữu cơ được bảo tồn trong trầm tích đá bùn 3,5 tỷ năm tuổi trên sao Hỏa.'},
  {id:80,u:'unit-1',ch:'ch4',s:'org',tp:'Evolutionary Unity',df:'intermediate',q:'What does the uniform presence of C, H, O, N, S, P across all living organisms reflect?',qv:'Sự có mặt đồng nhất của C, H, O, N, S, P trên tất cả các sinh vật sống phản ánh điều gì?',o:[{t:'Common evolutionary origin of all life on Earth',tv:'Nguồn gốc tiến hóa chung của toàn bộ sự sống trên Trái đất',c:true},{t:'That organisms spontaneously transform into rocks',tv:'Rằng sinh vật tự phát biến thành đá',c:false},{t:'That Earth was created yesterday',tv:'Rằng Trái đất mới được tạo ra hôm qua',c:false},{t:'That cells do not require chemistry',tv:'Rằng tế bào không cần hóa học',c:false}],ex:'Chemical uniformity across all kingdoms of life reflects common ancestry from a single origin.',exv:'Sự đồng nhất hóa học qua tất cả giới sinh vật phản ánh tổ tiên chung từ một nguồn gốc duy nhất.'},
  {id:81,u:'unit-1',ch:'ch4',s:'org',tp:'Vitalism vs Mechanism',df:'advanced',q:'Friedrich Wöhler\'s 1828 synthesis of urea from inorganic ammonium cyanate helped disprove which scientific doctrine?',qv:'Sự tổng hợp u rê từ ammonium cyanate vô cơ năm 1828 của Friedrich Wöhler đã giúp bác bỏ học thuyết khoa học nào?',o:[{t:'Vitalism (the belief that organic compounds require a supernatural "life force")',tv:'Thuyết sức sống (Vitalism - niềm tin hợp chất hữu cơ cần "lực sống" siêu nhiên)',c:true},{t:'Evolutionary theory',tv:'Thuyết tiến hóa',c:false},{t:'Atomic theory',tv:'Thuyết nguyên tử',c:false},{t:'Gravity',tv:'Thuyết hấp dẫn',c:false}],ex:'Wöhler proved organic molecules follow standard physical/chemical laws without vital forces.',exv:'Wöhler chứng minh phân tử hữu cơ tuân theo các quy luật vật lý/hóa học chuẩn mà không cần lực sống.'},
  {id:82,u:'unit-1',ch:'ch4',s:'org',tp:'Hydrocarbons',df:'basic',q:'Organic molecules consisting ONLY of Carbon and Hydrogen are called:',qv:'Các phân tử hữu cơ CHỈ bao gồm Carbon và Hydro được gọi là:',o:[{t:'Hydrocarbons',tv:'Hydrocarbon',c:true},{t:'Carbohydrates',tv:'Carbohydrate',c:false},{t:'Proteins',tv:'Protein',c:false},{t:'Nucleic acids',tv:'Axit nucleic',c:false}],ex:'Hydrocarbons (like methane, ethane, petroleum) contain only C and H atoms.',exv:'Hydrocarbon (như methane, ethane, dầu mỏ) chỉ chứa nguyên tử C và H.'},
  {id:83,u:'unit-1',ch:'ch4',s:'cbond',tp:'Isomer Definition',df:'basic',q:'Compounds that have the SAME molecular formula but DIFFERENT structures and properties are called:',qv:'Các hợp chất có CÙNG công thức phân tử nhưng KHÁC cấu trúc và tính chất được gọi là:',o:[{t:'Isomers',tv:'Đồng phân (Isomers)',c:true},{t:'Isotopes',tv:'Đồng vị (Isotopes)',c:false},{t:'Ions',tv:'Ion',c:false},{t:'Polymers',tv:'Polymer',c:false}],ex:'Isomers share the same chemical formula (e.g., C₅H₁₂) but differ in atom arrangement.',exv:'Đồng phân có cùng công thức hóa học (vd: C₅H₁₂) nhưng khác sắp xếp nguyên tử.'},
  {id:84,u:'unit-1',ch:'ch4',s:'cbond',tp:'Structural Isomers',df:'intermediate',q:'Pentane and 2-methylbutane both have molecular formula C₅H₁₂. What type of isomers are they?',qv:'Pentane và 2-methylbutane đều có công thức phân tử C₅H₁₂. Chúng thuộc loại đồng phân nào?',o:[{t:'Structural isomers',tv:'Đồng phân cấu trúc (Structural isomers)',c:true},{t:'Cis-trans isomers',tv:'Đồng phân cis-trans',c:false},{t:'Enantiomers',tv:'Đồng phân đối hình (Enantiomers)',c:false},{t:'Isotopes',tv:'Đồng vị',c:false}],ex:'Structural isomers differ in the covalent arrangement of their carbon skeleton (straight vs branched).',exv:'Đồng phân cấu trúc khác nhau về sắp xếp cộng hóa trị của bộ khung carbon (thẳng vs nhánh).'},
  {id:85,u:'unit-1',ch:'ch4',s:'cbond',tp:'Cis-Trans Isomers',df:'intermediate',q:'Cis-trans isomers differ in spatial arrangement around which type of chemical bond?',qv:'Đồng phân cis-trans khác nhau về vị trí không gian quanh loại liên kết hóa học nào?',o:[{t:'Double covalent bond (C=C)',tv:'Liên kết cộng hóa trị đôi (C=C)',c:true},{t:'Single bond (C—C)',tv:'Liên kết đơn (C—C)',c:false},{t:'Triple bond',tv:'Liên kết ba',c:false},{t:'Ionic bond',tv:'Liên kết ion',c:false}],ex:'Double bonds prevent carbon rotation, locking groups into cis (same side) or trans (opposite sides).',exv:'Liên kết đôi ngăn cản sự quay của carbon, khóa nhóm ở dạng cis (cùng bên) hoặc trans (khác bên).'},
  {id:86,u:'unit-1',ch:'ch4',s:'cbond',tp:'Enantiomers',df:'intermediate',q:'Enantiomers are isomers that are non-superimposable mirror images of each other due to the presence of an:',qv:'Đồng phân đối hình (Enantiomers) là các ảnh gương không chồng khít lên nhau do sự có mặt của một:',o:[{t:'Asymmetric carbon (bonded to 4 different chemical groups)',tv:'Carbon bất đối xứng (gắn với 4 nhóm hóa học khác nhau)',c:true},{t:'Ionic bond',tv:'Liên kết ion',c:false},{t:'Radioactive isotope',tv:'Đồng vị phóng xạ',c:false},{t:'Triple bond',tv:'Liên kết ba',c:false}],ex:'An asymmetric carbon attached to 4 distinct groups creates left-handed and right-handed mirror forms.',exv:'Carbon bất đối xứng gắn 4 nhóm riêng biệt tạo ra dạng ảnh gương tay trái và tay phải.'},
  {id:87,u:'unit-1',ch:'ch4',s:'cbond',tp:'Thalidomide Tragedy',df:'advanced',q:'Why was the pharmaceutical drug Thalidomide disastrously dangerous when prescribed to pregnant women in the 1950s?',qv:'Tại sao thuốc dược phẩm Thalidomide lại nguy hiểm thảm khốc khi kê đơn cho phụ nữ mang thai vào những năm 1950?',o:[{t:'One enantiomer reduced morning sickness, while the mirror enantiomer caused severe birth defects',tv:'Một dạng đối hình giảm ốm nghén, trong khi dạng đối hình ảnh gương gây dị tật bẩm sinh nghiêm trọng',c:true},{t:'It contained radioactive uranium',tv:'Nó chứa uranium phóng xạ',c:false},{t:'It turned blood into salt',tv:'Nó biến máu thành muối',c:false},{t:'It destroyed all human DNA',tv:'Nó phá hủy toàn bộ DNA ở người',c:false}],ex:'Thalidomide was sold as a racemic mixture: S-enantiomer caused limb birth defects, R-enantiomer treated nausea.',exv:'Thalidomide bán dưới dạng hỗn hợp racemic: dạng S gây dị tật chi bẩm sinh, dạng R chữa buồn nôn.'},
  {id:88,u:'unit-1',ch:'ch4',s:'cbond',tp:'Ibuprofen Enantiomers',df:'advanced',q:'In common painkillers like Ibuprofen, how much more effective is the S-enantiomer than the R-enantiomer?',qv:'Trong thuốc giảm đau phổ biến như Ibuprofen, dạng đối hình S hiệu quả hơn dạng đối hình R bao nhiêu lần?',o:[{t:'100 times more effective',tv:'Hiệu quả hơn 100 lần',c:true},{t:'2 times more effective',tv:'Hiệu quả hơn 2 lần',c:false},{t:'Equal effectiveness',tv:'Hiệu quả bằng nhau',c:false},{t:'10,000 times less effective',tv:'Kém hiệu quả hơn 10.000 lần',c:false}],ex:'S-ibuprofen is 100× more effective at inhibiting inflammation enzymes than R-ibuprofen.',exv:'S-ibuprofen hiệu quả hơn 100 lần trong ức chế enzyme viêm so với R-ibuprofen.'},
  {id:89,u:'unit-1',ch:'ch4',s:'cbond',tp:'Albuterol Asthma',df:'advanced',q:'In asthma inhaler medication Albuterol, what is the action of the S-enantiomer relative to the active R-enantiomer?',qv:'Trong thuốc xịt hen suyễn Albuterol, tác động của dạng đối hình S so với dạng đối hình R hoạt tính là gì?',o:[{t:'S-enantiomer counteracts the beneficial airway-relaxing effects of R-enantiomer',tv:'Dạng S chống lại các tác dụng giãn đường thở có lợi của dạng R',c:true},{t:'S-enantiomer doubles the power of R',tv:'Dạng S nhân đôi sức mạnh của R',c:false},{t:'S-enantiomer turns into water',tv:'Dạng S biến thành nước',c:false},{t:'S-enantiomer causes asthma',tv:'Dạng S gây ra hen suyễn',c:false}],ex:'Albuterol is now synthesized as pure R-albuterol (Levalbuterol) to avoid S-enantiomer counteraction.',exv:'Albuterol hiện được tổng hợp dưới dạng R-albuterol tinh khiết (Levalbuterol) để tránh dạng S chống lại.'},
  {id:90,u:'unit-1',ch:'ch4',s:'cbond',tp:'L-dopa Parkinson',df:'advanced',q:'L-dopa treats Parkinson\'s disease effectively. What is the pharmacological activity of D-dopa?',qv:'L-dopa điều trị bệnh Parkinson hiệu quả. Hoạt tính dược lý của D-dopa là gì?',o:[{t:'D-dopa has no pharmacological effect',tv:'D-dopa không có tác dụng dược lý',c:true},{t:'D-dopa cures Parkinson\'s instantly',tv:'D-dopa chữa khỏi Parkinson ngay lập tức',c:false},{t:'D-dopa is a poison',tv:'D-dopa là chất độc',c:false},{t:'D-dopa increases muscle mass',tv:'D-dopa làm tăng khối lượng cơ',c:false}],ex:'Biochemical pathways are single-enantiomer specific; D-dopa is biologically inactive.',exv:'Các con đường sinh hóa có tính đặc hiệu đối hình đơn; D-dopa không có hoạt tính sinh học.'},
  {id:91,u:'unit-1',ch:'ch4',s:'cbond',tp:'Isomer Combinations',df:'intermediate',q:'A alkane hydrocarbon with formula C₂₀H₄₂ has how many theoretical structural isomers?',qv:'Một hydrocarbon alkane với công thức C₂₀H₄₂ có bao nhiêu đồng phân cấu trúc về mặt lý thuyết?',o:[{t:'366,319 structural isomers',tv:'366.319 đồng phân cấu trúc',c:true},{t:'3 isomers',tv:'3 đồng phân',c:false},{t:'18 isomers',tv:'18 đồng phân',c:false},{t:'100 isomers',tv:'100 đồng phân',c:false}],ex:'Structural isomer possibilities explode with carbon chain length: C₅H₁₂=3, C∯H₁∯=18, C₂₀H₄₂=366,319.',exv:'Số khả năng đồng phân cấu trúc tăng bùng nổ theo chiều dài chuỗi carbon: C₅H₁₂=3, C∯H₁∯=18, C₂₀H₄₂=366.319.'},
  {id:92,u:'unit-1',ch:'ch4',s:'fgrp',tp:'Carboxyl Group',df:'basic',q:'Which functional group acts as an ACID by donating H⁺ in aqueous solution?',qv:'Nhóm chức năng nào hành động như một AXIT bằng cách cho H⁺ trong dung dịch nước?',o:[{t:'Carboxyl group (—COOH)',tv:'Nhóm Carboxyl (—COOH)',c:true},{t:'Amino group (—NH₂)',tv:'Nhóm Amino (—NH₂)',c:false},{t:'Methyl group (—CH₃)',tv:'Nhóm Methyl (—CH₃)',c:false},{t:'Sulfhydryl group (—SH)',tv:'Nhóm Sulfhydryl (—SH)',c:false}],ex:'Carboxyl (—COOH ⇌ —COO⁻ + H⁺) donates H⁺, making molecules organic acids (e.g., acetic acid).',exv:'Carboxyl (—COOH ⇌ —COO⁻ + H⁺) cho H⁺, biến phân tử thành axit hữu cơ (vd: axit acetic).'},
  {id:93,u:'unit-1',ch:'ch4',s:'fgrp',tp:'Amino Group',df:'basic',q:'Which functional group acts as a BASE by picking up an H⁺ ion in solution?',qv:'Nhóm chức năng nào hành động như một BAZƠ bằng cách nhận ion H⁺ trong dung dịch?',o:[{t:'Amino group (—NH₂)',tv:'Nhóm Amino (—NH₂)',c:true},{t:'Carboxyl group (—COOH)',tv:'Nhóm Carboxyl (—COOH)',c:false},{t:'Hydroxyl group (—OH)',tv:'Nhóm Hydroxyl (—OH)',c:false},{t:'Phosphate group (—PO₄)',tv:'Nhóm Phosphate (—PO₄)',c:false}],ex:'Amino group (—NH₂ + H⁺ ⇌ —NH₃⁺) acts as a base, acquiring a +1 charge.',exv:'Nhóm Amino (—NH₂ + H⁺ ⇌ —NH₃⁺) hành động như bazơ, nhận điện tích +1.'},
  {id:94,u:'unit-1',ch:'ch4',s:'fgrp',tp:'Sulfhydryl Group',df:'intermediate',q:'Sulfhydryl groups (—SH) can react to form covalent "cross-links" that stabilize which macromolecular structure?',qv:'Nhóm Sulfhydryl (—SH) có thể phản ứng tạo liên kết chéo cộng hóa trị để ổn định cấu trúc đại phân tử nào?',o:[{t:'Protein 3D tertiary and quaternary structure (disulfide bridges)',tv:'Cấu trúc 3D bậc ba và bậc tư của Protein (cầu disulfide)',c:true},{t:'DNA double helix',tv:'Xoắn kép DNA',c:false},{t:'Starch granules',tv:'Hạt tinh bột',c:false},{t:'Fatty acid chains',tv:'Chuỗi axit béo',c:false}],ex:'Two —SH groups react to form a covalent disulfide bridge (—S—S—) stabilizing protein folding.',exv:'Hai nhóm —SH phản ứng tạo cầu disulfide cộng hóa trị (—S—S—) ổn định sự cuộn gập protein.'},

  {id:96,u:'unit-1',ch:'ch4',s:'fgrp',tp:'Phosphate Group',df:'basic',q:'Which functional group carries a negative charge (−1 or −2) and plays a central role in cellular energy transfer?',qv:'Nhóm chức năng nào mang điện tích âm (−1 hoặc −2) và đóng vai trò trung tâm trong truyền năng lượng tế bào?',o:[{t:'Phosphate group (—PO₄²⁻)',tv:'Nhóm Phosphate (—PO₄²⁻)',c:true},{t:'Hydroxyl group (—OH)',tv:'Nhóm Hydroxyl (—OH)',c:false},{t:'Carbonyl group (C=O)',tv:'Nhóm Carbonyl (C=O)',c:false},{t:'Methyl group (—CH₃)',tv:'Nhóm Methyl (—CH₃)',c:false}],ex:'Phosphate groups contribute negative charge and release energy when reacted with water in ATP.',exv:'Nhóm phosphate đóng góp điện tích âm và giải phóng năng lượng khi phản ứng với nước trong ATP.'},

  {id:98,u:'unit-1',ch:'ch4',s:'fgrp',tp:'Sex Hormones',df:'advanced',q:'Estradiol (female sex hormone) and Testosterone (male sex hormone) have the exact same 4-ring carbon skeleton. How do they differ?',qv:'Estradiol (hormone sinh dục nữ) và Testosterone (hormone sinh dục nam) có cùng bộ khung carbon 4 vòng giống hệt. Chúng khác nhau thế nào?',o:[{t:'Differ only in attached chemical functional groups (hydroxyl vs carbonyl/methyl)',tv:'Chỉ khác nhau ở các nhóm chức năng hóa học gắn vào (hydroxyl vs carbonyl/methyl)',c:true},{t:'Estradiol has 100 carbon atoms',tv:'Estradiol có 100 nguyên tử carbon',c:false},{t:'Testosterone contains radioactive lead',tv:'Testosterone chứa chì phóng xạ',c:false},{t:'They are identical in all ways',tv:'Chúng giống hệt nhau về mọi mặt',c:false}],ex:'Minor functional group additions to the steroid skeleton produce vastly different male/female anatomy.',exv:'Bổ sung nhóm chức năng nhỏ vào bộ khung steroid tạo ra giải phẫu nam/nữ vô cùng khác biệt.'},

      var unitExp = S.expNav['u:' + u.id] || false;
      html += '<div class="sb-h sb-h2' + (unitExp ? ' op' : '') + '" onclick="toggleSB(this,\'u:' + u.id + '\')">';
      html += '<i class="fas fa-chevron-down ti"></i><i class="' + (u.ic || 'fas fa-book') + '"></i> ' + u.n + ': ' + u.t + '</div>';
      html += '<div class="sb-c' + (unitExp ? ' op' : '') + '">';

      if (u.ch) {
        u.ch.forEach(function(ch) {
          var chKey = u.id + ':' + ch.id;
          var chExp = S.expNav['c:' + chKey] || false;
          html += '<div class="sb-h sb-h3' + (chExp ? ' op' : '') + '" onclick="toggleSB(this,\'c:' + chKey + '\')">';
          html += '<i class="fas fa-chevron-down ti"></i>' + ch.t.split(':')[0] + '</div>';
          html += '<div class="sb-c' + (chExp ? ' op' : '') + '">';
          ch.sec.forEach(function(s) {
            var sOn = S.pg === u.id + ':' + ch.id + ':' + s.id;
            html += '<div class="ni' + (sOn ? ' on' : '') + '" onclick="nav(\'' + u.id + ':' + ch.id + ':' + s.id + '\')"><i class="fas fa-file-lines"></i> ' + s.t + '</div>';
          });
          html += '</div>';
        });
      }

      if (S.imp.length > 0) {
        S.imp.forEach(function(d, i) {
          if (d.unit === u.id) {
            html += '<div class="ni' + (S.pg === 'imp-' + i ? ' on' : '') + '" onclick="nav(\'imp-' + i + '\')"><i class="fas fa-file-import"></i> ' + d.title + '</div>';
          }
        });
      }

      html += '</div>';
    });

    S.imp.forEach(function(d, i) {
      if (!d.unit || !U.find(function(u) { return u.id === d.unit; })) {
        html += '<div class="ni' + (S.pg === 'imp-' + i ? ' on' : '') + '" onclick="nav(\'imp-' + i + '\')"><i class="fas fa-file-import"></i> ' + d.title + '</div>';
      }
    });

    html += '</div>';
  });
  html += '</div>';

  html += '<div class="nsec"><div class="nst">Study Tools</div>';
  html += '<div class="ni' + (S.pg === 'quiz' ? ' on' : '') + '" onclick="nav(\'quiz\')"><i class="fas fa-question-circle"></i> Question Bank</div>';
  html += '<div class="ni' + (S.pg === 'flash' ? ' on' : '') + '" onclick="nav(\'flash\')"><i class="fas fa-clone"></i> Flashcards</div>';
  html += '<div class="ni' + (S.pg === 'reference' ? ' on' : '') + '" onclick="nav(\'reference\')"><i class="fas fa-scroll"></i> Exam References' + (S.refs.length > 0 ? '<span class="bg">' + S.refs.length + '</span>' : '') + '</div>';
  html += '<div class="ni' + (S.pg === 'assistant' ? ' on' : '') + '" onclick="nav(\'assistant\')"><i class="fas fa-robot"></i> AI Assistant</div>';
  html += '<div class="ni' + (S.pg === 'gen' ? ' on' : '') + '" onclick="nav(\'gen\')"><i class="fas fa-robot"></i> AI Generator</div>';
  html += '<div class="ni' + (S.pg === 'import' ? ' on' : '') + '" onclick="nav(\'import\')"><i class="fas fa-file-import"></i> Import</div>';
  html += '<div class="ni' + (S.pg === 'settings' ? ' on' : '') + '" onclick="nav(\'settings\')"><i class="fas fa-cog"></i> Settings</div>';
  html += '</div>';

  nav.innerHTML = html;
}

function toggleSB(el, key) {
  S.expNav[key] = !S.expNav[key];
  tSec(el);
}

function nav(p) {
  S.pg = p;
  if (p && !p.startsWith('imp-') && p !== 'dashboard' && p !== 'lectures' && p !== 'quiz' && p !== 'flash' && p !== 'gen' && p !== 'import' && p !== 'settings' && p !== 'assistant' && p !== 'reference') {
    var parts = p.split(':');
    BOOKS.forEach(function(b) { S.expNav['b:' + b.id] = true; });
    var u = U.find(function(x) { return x.id === parts[0]; });
    if (u) {
      S.expNav['u:' + u.id] = true;
      if (parts[1]) S.expNav['c:' + u.id + ':' + parts[1]] = true;
    }
  }
  buildSidebar();
  var t = document.getElementById('ptitle');
  var c = document.getElementById('mcon');
  switch (p) {
    case 'dashboard': rDash(c, t); break;
    case 'lectures': rUnits(c, t); break;
    case 'quiz': rQuiz(c, t); break;
    case 'flash': rFlash(c, t); break;
    case 'reference': rReference(c, t); break;
    case 'gen': rGen(c, t); break;
    case 'import': rImp(c, t); break;
    case 'settings': rSettings(c, t); break;
    case 'assistant': rAssistant(c, t); break;
    default:
      if (p.startsWith('imp-')) {
        var idx = parseInt(p.split('-')[1]);
        viewImp(c, t, idx);
      } else {
        var parts = p.split(':');
        var u = U.find(function(x) { return x.id === parts[0]; });
        if (u) {
          if (parts.length === 1) rUnit(c, t, u);
          else if (parts.length === 2) rChapter(c, t, u, parts[1]);
          else rSection(c, t, u, parts[1], parts[2]);
        }
      }
  }
  c.scrollTop = 0;
}

function rDash(c, t) {
  t.textContent = 'Dashboard';
  var tc = 0;
  U.forEach(function(u) { if (u.ch) u.ch.forEach(function(ch) { tc += ch.sec.length; }); });
  var tq = QB.length + S.imp.reduce(function(s, d) { return s + (d.q ? d.q.length : 0); }, 0);
  c.innerHTML = '<div class="sgrid">'
    + '<div class="sc"><div class="si"><i class="fas fa-book-open"></i></div><div class="sv">' + U.length + '</div><div class="sl">Units / Đơn vị học</div></div>'
    + '<div class="sc"><div class="si"><i class="fas fa-layer-group"></i></div><div class="sv">' + tc + '</div><div class="sl">Sections / Mục nội dung</div></div>'
    + '<div class="sc"><div class="si"><i class="fas fa-question-circle"></i></div><div class="sv">' + tq + '</div><div class="sl">Questions / Câu hỏi</div></div>'
    + '<div class="sc" onclick="nav(\'reference\')" style="cursor:pointer"><div class="si"><i class="fas fa-scroll"></i></div><div class="sv">' + S.refs.length + '</div><div class="sl">Exam References / Tham khảo</div></div>'
    + '</div>'
    + '<h2 style="font-size:1.15rem;font-weight:700;margin-bottom:18px">Units — MedStudy</h2>'
    + '<div class="ugrid">' + U.map(function(u) {
      var allSec = [];
      if (u.ch) u.ch.forEach(function(ch) { ch.sec.forEach(function(s) { allSec.push(s); }); });
      return '<div class="uc" onclick="nav(\'' + u.id + '\')">'
        + '<div class="uch"><div class="un">' + u.n + '</div><h3>' + u.t + '<span class="vi">' + u.tv + '</span></h3></div>'
        + '<div class="ucb"><ul class="clist">' + allSec.slice(0, 6).map(function(x) {
          return '<li>' + x.t + '<br><small style="color:var(--t3)">' + x.tv + '</small></li>';
        }).join('') + (allSec.length > 6 ? '<li style="color:var(--ac1)">+ ' + (allSec.length - 6) + ' more...</li>' : '') + '</ul></div>'
        + '<div class="ucf">'
        + '<button class="btn bp sm" onclick="event.stopPropagation();nav(\'' + u.id + '\')"><i class="fas fa-book-open"></i> Study</button>'
        + '<button class="btn bs sm" onclick="event.stopPropagation();nav(\'quiz\')"><i class="fas fa-question-circle"></i> Quiz</button>'
        + '</div></div>';
    }).join('') + '</div>';
}

function rUnits(c, t) {
  t.textContent = 'All Books';
  var booksHtml = '';
  BOOKS.forEach(function(book) {
    booksHtml += '<h2 style="font-size:1.2rem;font-weight:800;margin:28px 0 16px;display:flex;align-items:center;gap:10px"><i class="' + book.icon + '" style="color:var(--ac1)"></i> ' + book.name + '</h2>';
    booksHtml += '<div class="ugrid" style="margin-bottom:32px">' + U.map(function(u) {

      if (u.ch) u.ch.forEach(function(ch) { ch.sec.forEach(function(s) { allSec.push(s); }); });
      return '<div class="uc" onclick="nav(\'' + u.id + '\')">'

        + '<div class="ucb"><ul class="clist">' + allSec.map(function(x) {
          return '<li>' + x.t + '<br><small style="color:var(--t3)">' + x.tv + '</small></li>';
        }).join('') + '</ul></div>'
        + '<div class="ucf"><button class="btn bp sm" onclick="event.stopPropagation();nav(\'' + u.id + '\')"><i class="fas fa-book-open"></i> Study</button></div>'
        + '</div>';
    }).join('') + '</div>';
  });
  c.innerHTML = '<div style="max-width:1200px;margin:0 auto">' + booksHtml + '</div>';
}

  html += '<div style="text-align:center;margin-bottom:28px">';

        html += '<div class="sb2 ' + (i === 0 ? 'op ' : '') + (S.layoutMode === 'side' ? 'side-by-side' : '') + '">';
        html += '<div class="cen"><div class="cl en"><i class="fas fa-language"></i> English</div><div class="ct">' + s.en + '</div></div>';

      });
      html += '</div>';
    });
  }
  html += '<div style="text-align:center;margin-top:36px;padding:28px;background:var(--bg2);border:1px solid var(--br1);border-radius:var(--r3)">';

  html += '<button class="btn bp" onclick="nav(\'quiz\')"><i class="fas fa-question-circle"></i> Practice Questions</button>';
  html += '<button class="btn bs" style="margin-left:10px" onclick="nav(\'flash\')"><i class="fas fa-clone"></i> Flashcards</button>';

}

function rChapter(c, t, u, chid) {
  var ch = u.ch.find(function(x) { return x.id === chid; });
  if (!ch) return rUnit(c, t, u);
  t.textContent = ch.t;
  var html = '<div class="lc ' + (S.layoutMode === 'side' ? 'side-mode' : '') + '">';

  html += '<button class="btn bs sm" onclick="nav(\'lectures\')"><i class="fas fa-th-large"></i> All Books</button>';
  html += '</div>';
  html += '<div style="text-align:center;margin-bottom:28px">';
  html += '<div style="font-size:.68rem;text-transform:uppercase;letter-spacing:2px;color:var(--ac2);font-weight:700;margin-bottom:6px">' + u.n + ' — ' + ch.t.split(':')[0] + '</div>';

  ch.sec.forEach(function(s, i) {

    html += '</div>';

    html += '</div></div>';
  });
  html += '</div>';
  c.innerHTML = html;
}

function rSection(c, t, u, chid, sid) {
  var ch = u.ch.find(function(x) { return x.id === chid; });
  if (!ch) return rUnit(c, t, u);
  var s = ch.sec.find(function(x) { return x.id === sid; });
  if (!s) return rChapter(c, t, u, chid);
  t.textContent = s.t;
  var si = ch.sec.indexOf(s);
  var prev = si > 0 ? ch.sec[si - 1] : null;
  var next = si < ch.sec.length - 1 ? ch.sec[si + 1] : null;
  var html = '<div class="lc ' + (S.layoutMode === 'side' ? 'side-mode' : '') + '">';
  html += '<div class="lnav">';
  html += prev ? '<button class="btn bs sm" onclick="nav(\'' + u.id + ':' + chid + ':' + prev.id + '\')"><i class="fas fa-chevron-left"></i> Prev</button>' : '<div></div>';
  html += '<button class="btn ' + (S.layoutMode === 'side' ? 'bp' : 'bs') + ' sm" onclick="toggleLayoutMode()"><i class="fas ' + (S.layoutMode === 'side' ? 'fa-columns' : 'fa-align-justify') + '"></i> ' + (S.layoutMode === 'side' ? 'Đọc Song Song (Side-by-Side)' : 'Đọc Trên/Dưới (Stacked)') + '</button>';
  html += next ? '<button class="btn bs sm" onclick="nav(\'' + u.id + ':' + chid + ':' + next.id + '\')">Next <i class="fas fa-chevron-right"></i></button>' : '<div></div>';
  html += '</div>';
  html += '<div style="text-align:center;margin-bottom:28px">';
  html += '<div style="font-size:.68rem;text-transform:uppercase;letter-spacing:2px;color:var(--ac1);font-weight:700;margin-bottom:6px">' + u.n + ' &bull; ' + ch.t.split(':')[0] + '</div>';
  html += '<h1 style="font-size:1.5rem;font-weight:900;margin-bottom:4px">' + s.t + '</h1>';
  html += '<p style="font-size:.9rem;color:var(--t2)">' + s.tv + '</p></div>';
  html += '<div class="sb"><div class="sb2 op ' + (S.layoutMode === 'side' ? 'side-by-side' : '') + '">';
  html += '<div class="cen"><div class="cl en"><i class="fas fa-language"></i> English</div><div class="ct">' + s.en + '</div></div>';
  html += '<div class="cen"><div class="cl vi"><i class="fas fa-language"></i> Tiếng Việt</div><div class="ct">' + s.vi + '</div></div>';
  html += '</div></div>';
  html += '<div style="text-align:center;margin-top:36px;padding:28px;background:var(--bg2);border:1px solid var(--br1);border-radius:var(--r3)">';
  html += '<h3 style="margin-bottom:10px">Finished? / Hoàn thành?</h3>';
  html += '<button class="btn bp" onclick="nav(\'quiz\')"><i class="fas fa-question-circle"></i> Practice Questions</button>';
  html += '<button class="btn bs" style="margin-left:10px" onclick="nav(\'flash\')"><i class="fas fa-clone"></i> Flashcards</button>';
  html += '</div></div>';
  c.innerHTML = html;
}

function tSec(h) { h.classList.toggle('op'); h.nextElementSibling.classList.toggle('op'); }

function rQuiz(c, t) {
  t.textContent = 'Question Bank';
  var uniqueCh = [];
  QB.forEach(function(q) { if (uniqueCh.indexOf(q.ch) === -1) uniqueCh.push(q.ch); });
  var chOptions = uniqueCh.map(function(chid) {
    var chName = chid;
    U.forEach(function(u) { if (u.ch) { var found = u.ch.find(function(x) { return x.id === chid; }); if (found) chName = found.t; } });
    return '<option value="' + chid + '">' + chName + '</option>';
  }).join('');
  var html = '<div class="qc"><div class="qhdr"><h2>Question Bank</h2><p>Ngân hàng Câu hỏi Trắc nghiệm — Song ngữ Anh/Việt</p></div>';
  html += '<div class="qf">';
  html += '<select id="qfU" onchange="fQuiz()"><option value="all">All Chapters</option>' + chOptions + '</select>';
  html += '<select id="qfD" onchange="fQuiz()"><option value="all">All Levels</option><option value="basic">Basic / Cơ bản</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced / Nâng cao</option></select>';
  html += '<button class="btn bp sm" onclick="subQ()"><i class="fas fa-check"></i> Submit All</button>';
  html += '<button class="btn bs sm" onclick="resQ()"><i class="fas fa-redo"></i> Reset</button>';
  html += '</div>';
  html += '<div id="qSA"></div><div id="qQs">';
  QB.forEach(function(q, i) {
    var chName = q.ch;
    U.forEach(function(u) { if (u.ch) { var found = u.ch.find(function(x) { return x.id === q.ch; }); if (found) chName = found.t.split(':')[0]; } });
    html += '<div class="qcard" data-u="' + q.ch + '" data-d="' + q.df + '" id="q-' + q.id + '">';
    html += '<div class="qn">Q' + (i + 1) + ' &bull; ' + q.df.toUpperCase() + ' &bull; ' + chName + '</div>';
    html += '<div class="qt">' + q.q + '<span class="vi">' + q.qv + '</span></div>';
    html += '<ul class="ol">';
    q.o.forEach(function(o, j) {
      html += '<li class="oi" data-c="' + o.c + '" onclick="selO(this)"><span class="ol2">' + String.fromCharCode(65 + j) + '</span><span class="otp">' + o.t + '<span class="vi">' + o.tv + '</span></span></li>';
    });
    html += '</ul>';
    html += '<div class="exp" id="ex-' + q.id + '"><h4><i class="fas fa-lightbulb"></i> Explanation / Giải thích</h4><p>' + q.ex + '</p><p style="margin-top:6px;color:var(--t3);font-style:italic">' + q.exv + '</p></div>';
    html += '</div>';
  });
  html += '</div></div>';
  c.innerHTML = html;
}

function selO(e) {
  var c = e.closest('.qcard');
  if (c.classList.contains('ans')) return;
  c.querySelectorAll('.oi').forEach(function(o) { o.classList.remove('sel'); });
  e.classList.add('sel');
}

function subQ() {
  var co = 0, tt = 0;
  document.querySelectorAll('.qcard').forEach(function(c) {
    if (c.style.display === 'none') return;
    c.classList.add('ans');
    var s = c.querySelector('.oi.sel');
    var cr = c.querySelector('.oi[data-c="true"]');
    var e = c.querySelector('.exp');
    if (s) { tt++; if (s.dataset.c === 'true') { s.classList.add('cor'); co++; } else { s.classList.add('wrg'); cr.classList.add('cor'); } }
    else { cr.classList.add('cor'); }
    if (e) e.classList.add('sh');
  });
  var sa = document.getElementById('qSA');
  if (tt > 0) {
    var p = Math.round(co / tt * 100);
    var badge = p >= 80 ? '<span class="tag tagg"><i class="fas fa-check-circle"></i> Excellent!</span>' : p >= 60 ? '<span class="tag taga"><i class="fas fa-star"></i> Good!</span>' : '<span class="tag tagb"><i class="fas fa-book"></i> Keep studying!</span>';
    sa.innerHTML = '<div class="qsc"><div class="sv2">' + p + '%</div><div class="sl2">' + co + '/' + tt + ' correct</div><div style="margin-top:10px">' + badge + '</div></div>';
  }
}

function resQ() {
  document.querySelectorAll('.qcard').forEach(function(c) {
    c.classList.remove('ans');
    c.querySelectorAll('.oi').forEach(function(o) { o.classList.remove('sel', 'cor', 'wrg'); });
    var e = c.querySelector('.exp');
    if (e) e.classList.remove('sh');
  });
  document.getElementById('qSA').innerHTML = '';
}

function fQuiz() {
  var u = document.getElementById('qfU').value;
  var d = document.getElementById('qfD').value;
  document.querySelectorAll('.qcard').forEach(function(c) {
    c.style.display = ((u === 'all' || c.dataset.u === u) && (d === 'all' || c.dataset.d === d)) ? '' : 'none';
  });
}

function rFlash(c, t) {
  t.textContent = 'Flashcards';
  var q = QB[S.fi] || QB[0];
  S.ff = false;
  var correctAns = q.o.filter(function(o) { return o.c; });
  var html = '<div class="fc">';
  html += '<div class="fcnt">' + (S.fi + 1) + ' / ' + QB.length + '</div>';
