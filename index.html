<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="author" content="Hiển The Doctor">
<meta name="description" content="MedStudy — Bilingual Medical Lecture Platform created by Hiển The Doctor">
<title>MedStudy — Bilingual Medical Lecture Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg0:#060a13;--bg1:#0b1120;--bg2:#111827;--bg3:#1a2332;--bg4:#1e293b;--br1:rgba(148,163,184,0.08);--br2:rgba(148,163,184,0.15);--t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--ac1:#3b82f6;--ac2:#6366f1;--ac3:#06b6d4;--ac4:#10b981;--ac5:#f59e0b;--ac6:#f43f5e;--ok:#10b981;--okb:rgba(16,185,129,0.12);--er:#ef4444;--erb:rgba(239,68,68,0.12);--r1:8px;--r2:12px;--r3:16px;--r4:20px;--sh:0 4px 24px rgba(0,0,0,0.3);--sg:0 0 30px rgba(59,130,246,0.15);--tr:all .3s cubic-bezier(.4,0,.2,1);--sw:280px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg0);color:var(--t1);height:100vh;overflow:hidden;display:flex}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--t3);border-radius:3px}
.sidebar{width:280px;min-width:280px;height:100vh;background:var(--bg1);border-right:1px solid var(--br1);display:flex;flex-direction:column;z-index:100;flex-shrink:0;margin-left:0;transition:margin-left .35s cubic-bezier(.4,0,.2,1),opacity .3s ease!important;opacity:1}
.sbrand{padding:20px 18px 14px;border-bottom:1px solid var(--br1)}
.sbrand h1{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#0ea5e9,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px}
.sbrand h1 i{-webkit-text-fill-color:#0ea5e9;font-size:1.15rem}
.sbrand p{font-size:.6rem;color:var(--t3);margin-top:3px;letter-spacing:1.5px;text-transform:uppercase}
.snav{flex:1;padding:8px 4px;overflow-y:auto}
.nsec{margin-bottom:4px}
.nst{font-size:.6rem;text-transform:uppercase;letter-spacing:1.8px;color:var(--t3);padding:10px 14px 4px;font-weight:700;opacity:.7}
.ni{display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:var(--r1);cursor:pointer;transition:background .15s,color .15s;color:var(--t2);font-size:.82rem;font-weight:500;position:relative;margin:1px 6px}
.ni:hover{background:rgba(148,163,184,.08);color:var(--t1)}
.ni.on{background:rgba(59,130,246,.12);color:var(--ac1)}
.ni.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--ac1);border-radius:0 3px 3px 0}
.ni i{width:20px;text-align:center;font-size:.85rem;flex-shrink:0}
.ni .bg{margin-left:auto;background:var(--ac1);color:#fff;font-size:.55rem;padding:2px 7px;border-radius:10px;font-weight:700}
.sb-h{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:.78rem;color:var(--t3);font-weight:600;cursor:pointer;transition:background .15s,color .15s;letter-spacing:.3px;border-radius:var(--r1);margin:1px 6px;user-select:none}
.sb-h:hover{background:rgba(148,163,184,.08);color:var(--t2)}
.sb-h .ti{transition:transform .2s ease;color:var(--t3);font-size:.55rem;width:14px;text-align:center;flex-shrink:0}
.sb-h.op .ti{transform:rotate(180deg)}
.sb-c{display:none;padding:2px 0 2px 16px}
.sb-c.op{display:block}
.sb-h2{padding-left:14px;font-size:.73rem}
.sb-h3{padding-left:28px;font-size:.7rem}
.sfoot{padding:14px 20px;border-top:1px solid var(--br1);font-size:.65rem;color:var(--t3);text-align:center}.sfoot .creator{font-size:.9rem;margin-top:8px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.mhdr{height:56px;border-bottom:1px solid var(--br1);display:flex;align-items:center;padding:0 28px;gap:16px;background:var(--bg1);flex-shrink:0}
.mhdr h2{font-size:1.05rem;font-weight:700;flex:1}
.hact{display:flex;gap:10px;align-items:center}
.btn{padding:8px 16px;border-radius:var(--r1);border:none;cursor:pointer;font-size:.8rem;font-weight:600;font-family:inherit;transition:var(--tr);display:inline-flex;align-items:center;gap:8px}
.bp{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;box-shadow:0 2px 12px rgba(59,130,246,.3)}
.bp:hover{box-shadow:0 4px 20px rgba(59,130,246,.5);transform:translateY(-1px)}
.bs{background:var(--bg3);color:var(--t1);border:1px solid var(--r2)}
.bs:hover{background:var(--bg4);border-color:var(--ac1)}
.bs2{background:var(--ok);color:#fff}
.sm{padding:6px 12px;font-size:.72rem}
.ic{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:var(--r1)}
.mcon{flex:1;overflow-y:auto;padding:28px;min-height:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:28px}
.sc{background:var(--bg2);border:1px solid var(--br1);border-radius:var(--r3);padding:22px;transition:var(--tr);position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sc:nth-child(1)::before{background:var(--ac1)}.sc:nth-child(2)::before{background:var(--ac4)}.sc:nth-child(3)::before{background:var(--ac3)}.sc:nth-child(4)::before{background:var(--ac5)}
.sc:hover{transform:translateY(-2px);box-shadow:var(--sg)}
.si{width:44px;height:44px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;margin-bottom:14px}
.sc:nth-child(1) .si{background:rgba(59,130,246,.12);color:var(--ac1)}.sc:nth-child(2) .si{background:rgba(16,185,129,.12);color:var(--ac4)}.sc:nth-child(3) .si{background:rgba(6,182,212,.12);color:var(--ac3)}.sc:nth-child(4) .si{background:rgba(245,158,11,.12);color:var(--ac5)}
.sv{font-size:1.9rem;font-weight:800;margin-bottom:2px}.sl{font-size:.75rem;color:var(--t2)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
.uc{background:var(--bg2);border:1px solid var(--br1);border-radius:var(--r3);overflow:hidden;transition:var(--tr);cursor:pointer}
.uc:hover{transform:translateY(-3px);box-shadow:var(--sg);border-color:var(--ac1)}
.uch{padding:22px;border-bottom:1px solid var(--br1)}
.uch .un{font-size:.65rem;text-transform:uppercase;letter-spacing:2px;color:var(--ac1);font-weight:700;margin-bottom:6px}
.uch h3{font-size:1rem;font-weight:700;line-height:1.4}
.uch .vi{display:block;font-size:.82rem;color:var(--t2);margin-top:4px;font-weight:500}
.ucb{padding:14px 22px}
.clist{list-style:none}.clist li{padding:5px 0;font-size:.8rem;color:var(--t2);display:flex;gap:8px}.clist li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ac1);margin-top:6px;flex-shrink:0}
.ucf{padding:10px 22px 18px;display:flex;gap:8px}
.lc{max-width:880px;margin:0 auto}
.lnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.sb{background:var(--bg2);border:1px solid var(--br1);border-radius:var(--r3);margin-bottom:20px;overflow:hidden}
.sh{padding:18px 24px;border-bottom:1px solid var(--br1);display:flex;align-items:center;gap:12px;cursor:pointer;transition:var(--tr)}
.sh:hover{background:var(--bg4)}.sh h3{font-size:.95rem;font-weight:700;flex:1}
.sh .ti{transition:var(--tr);color:var(--t3)}.sh.op .ti{transform:rotate(180deg)}
.sb2{padding:22px 24px;display:none}.sb2.op{display:block}
.cen{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--br1)}
.cen:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.cl{font-size:.65rem;text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:10px;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:4px}
.cl.en{background:rgba(59,130,246,.12);color:var(--ac1)}.cl.vi{background:rgba(16,185,129,.12);color:var(--ac4)}
.ct{font-size:.9rem;line-height:1.8;color:var(--t2)}.ct strong{color:var(--t1);font-weight:600}.ct em{color:var(--ac3);font-style:italic}
.kt{display:inline;background:rgba(99,102,241,.12);color:var(--ac2);padding:1px 6px;border-radius:4px;font-weight:600;font-size:.86rem}
.fb{background:var(--bg3);border:1px solid var(--br2);border-radius:var(--r2);padding:14px 20px;margin:14px 0;text-align:center;font-size:1rem;font-family:monospace;color:var(--ac3)}
.cbx{background:linear-gradient(135deg,rgba(244,63,94,.08),rgba(99,102,241,.08));border:1px solid rgba(244,63,94,.2);border-radius:var(--r2);padding:18px 22px;margin:14px 0}
.cbx h4{font-size:.78rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--ac6);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.cbx p{font-size:.85rem;color:var(--t2);line-height:1.7}
.sbx{background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(6,182,212,.08));border:1px solid rgba(16,185,129,.2);border-radius:var(--r2);padding:18px 22px;margin:14px 0}
.sbx h4{font-size:.78rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--ac4);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sbx p{font-size:.85rem;color:var(--t2);line-height:1.7}
.qc{max-width:780px;margin:0 auto}.qhdr{text-align:center;margin-bottom:28px}.qhdr h2{font-size:1.4rem;font-weight:800;margin-bottom:6px}.qhdr p{color:var(--t2);font-size:.88rem}
.qf{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.qf select{background:var(--bg2);border:1px solid var(--r2);color:var(--t1);padding:8px 14px;border-radius:var(--r1);font-family:inherit;font-size:.82rem}
.qcard{background:var(--bg2);border:1px solid var(--br1);border-radius:var(--r3);padding:26px;margin-bottom:18px;transition:var(--tr)}
.qcard:hover{border-color:var(--br2)}
.qn{font-size:.68rem;text-transform:uppercase;letter-spacing:2px;color:var(--ac1);font-weight:700;margin-bottom:8px}
.qt{font-size:.92rem;font-weight:600;margin-bottom:18px;line-height:1.6}.qt .vi{display:block;color:var(--t2);font-weight:400;margin-top:6px;font-size:.85rem}
.ol{list-style:none;display:flex;flex-direction:column;gap:8px}
.oi{padding:12px 16px;border:1px solid var(--br2);border-radius:var(--r2);cursor:pointer;transition:var(--tr);display:flex;align-items:flex-start;gap:12px;font-size:.85rem}
.oi:hover{background:var(--bg4);border-color:var(--ac1)}
.oi.sel{background:rgba(59,130,246,.12);border-color:var(--ac1);color:var(--ac1)}
.oi.cor{background:rgba(16,185,129,.12);border-color:var(--ac4);color:var(--ac4)}
.oi.wrg{background:rgba(239,68,68,.12);border-color:var(--er);color:var(--er)}
.ol2{width:26px;height:26px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex-shrink:0}
.otp{flex:1;line-height:1.5}.otp .vi{display:block;color:var(--t3);font-size:.8rem;margin-top:2px}
.exp{margin-top:14px;padding:14px 18px;background:var(--bg3);border-radius:var(--r2);border-left:3px solid var(--ac4);display:none}
.exp.sh{display:block}.exp h4{font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--ac4);margin-bottom:6px}.exp p{font-size:.82rem;color:var(--t2);line-height:1.7}
.qsc{text-align:center;padding:28px;background:var(--bg2);border:1px solid var(--br1);border-radius:var(--r3);margin-bottom:22px}
.qsc .sv2{font-size:2.8rem;font-weight:900;background:linear-gradient(135deg,#0ea5e9,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.qsc .sl2{font-size:.88rem;color:var(--t2);margin-top:4px}
.imp{max-width:680px;margin:0 auto}
.drop{border:2px dashed var(--r2);border-radius:var(--r3);padding:50px 36px;text-align:center;transition:var(--tr);cursor:pointer;background:var(--bg2)}
.drop:hover,.drop.dov{border-color:var(--ac1);background:rgba(59,130,246,.05)}
.drop i{font-size:2.5rem;color:var(--t3);margin-bottom:14px}
.drop h3{font-size:1.05rem;font-weight:700;margin-bottom:6px}.drop p{color:var(--t2);font-size:.82rem}
.fm{margin-top:24px}.fg{margin-bottom:18px}.fg label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:var(--t2)}
.fg input,.fg textarea,.fg select{width:100%;background:var(--bg2);border:1px solid var(--r2);color:var(--t1);padding:10px 14px;border-radius:var(--r2);font-family:inherit;font-size:.85rem;transition:var(--tr)}
.fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:var(--ac1);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.fg textarea{min-height:160px;resize:vertical}
.il{margin-top:24px}
.ii{background:var(--bg2);border:1px solid var(--br1);border-radius:var(--r2);padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:var(--tr)}
.ii:hover{border-color:var(--br2)}
.ii .iic{width:40px;height:40px;border-radius:var(--r1);background:rgba(59,130,246,.12);display:flex;align-items:center;justify-content:center;color:var(--ac1);font-size:1rem;flex-shrink:0}
.ii .iii{flex:1}.ii .iii h4{font-size:.88rem;font-weight:600}.ii .iii p{font-size:.72rem;color:var(--t3);margin-top:2px}
.gc{max-width:680px;margin:0 auto}
.gf{background:var(--bg2);border:1px solid var(--br1);border-radius:var(--r3);padding:28px}
.glo{text-align:center;padding:36px;color:var(--t3)}.glo i{font-size:2rem;animation:sp 1s linear infinite;margin-bottom:10px;display:block}
@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.fc{max-width:580px;margin:0 auto;text-align:center}
.fw{perspective:1000px;margin-bottom:28px}
.flc{width:100%;min-height:300px;position:relative;transition:transform .6s;transform-style:preserve-3d;cursor:pointer;border-radius:var(--r3)}
.flc.flp{transform:rotateY(180deg)}
.ff{position:absolute;width:100%;min-height:300px;backface-visibility:hidden;border-radius:var(--r3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;border:1px solid var(--br1)}
.ffr{background:linear-gradient(135deg,var(--bg2),var(--bg3))}
.ffbk{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(6,182,212,.1));transform:rotateY(180deg);border-color:rgba(16,185,129,.3)}
.fctrl{display:flex;gap:12px;justify-content:center}
.fcnt{font-size:.82rem;color:var(--t3);margin-bottom:18px}
/* ===== Mobile Responsive ===== */
.menu-toggle{display:none;background:none;border:none;color:var(--t1);font-size:1.3rem;cursor:pointer;padding:6px 8px;border-radius:var(--r1);transition:var(--tr);flex-shrink:0}
.menu-toggle:hover{background:rgba(148,163,184,.08)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:199;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sidebar-overlay.active{display:block}
@media(max-width:768px){
  .menu-toggle{display:flex;align-items:center;justify-content:center}
  .sidebar{position:fixed;left:0;transform:translateX(-100%);width:280px;min-width:280px;z-index:200;transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:none}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.4)}
  .mhdr{height:52px;padding:0 12px;gap:8px}
  .mhdr h2{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .hact{gap:6px}
  .hact .btn{padding:7px 10px;font-size:.72rem;gap:4px}
  .btn-text{display:none}
  .mcon{padding:16px 12px}
  .sgrid{grid-template-columns:repeat(2,1fr);gap:12px}
  .sc{padding:16px}.sv{font-size:1.5rem}
  .si{width:36px;height:36px;font-size:1rem;margin-bottom:10px}
  .sl{font-size:.7rem}
  .ugrid{grid-template-columns:1fr;gap:14px}
  .uch{padding:16px}.uch h3{font-size:.95rem}
  .ucb{padding:10px 16px}
  .ucf{padding:8px 16px 14px}
  .lc{max-width:100%}
  .lnav{flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .lnav .btn{font-size:.68rem;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sh{padding:14px 16px;gap:10px}
  .sh h3{font-size:.86rem;line-height:1.4}
  .sb2{padding:16px}
  .ct{font-size:.85rem;line-height:1.75}
  .fb{font-size:.85rem;padding:12px 14px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .cbx,.sbx{padding:14px 16px;margin:10px 0}
  .cbx h4,.sbx h4{font-size:.7rem}
  .cbx p,.sbx p{font-size:.82rem}
  .cl{font-size:.58rem;padding:3px 6px}
  .cen{margin-bottom:16px;padding-bottom:16px}
  .kt{font-size:.82rem;padding:1px 4px}
  .qc{max-width:100%}
  .qhdr{margin-bottom:20px}.qhdr h2{font-size:1.15rem}.qhdr p{font-size:.82rem}
  .qf{gap:8px}
  .qf select{font-size:16px;padding:8px 10px;flex:1;min-width:0}
  .qcard{padding:18px;margin-bottom:14px}
  .qn{font-size:.62rem;margin-bottom:6px}
  .qt{font-size:.86rem;margin-bottom:14px;line-height:1.5}
  .qt .vi{font-size:.82rem;margin-top:4px}
  .oi{padding:12px 14px;font-size:.84rem;min-height:48px;gap:10px}
  .ol2{width:28px;height:28px;font-size:.76rem}
  .otp{font-size:.84rem;line-height:1.5}
  .otp .vi{font-size:.78rem}
  .exp{padding:12px 14px;margin-top:12px}
  .exp p{font-size:.8rem}
  .qsc{padding:22px}.qsc .sv2{font-size:2.2rem}
  .fc{max-width:100%;padding:0}
  .fw{margin-bottom:20px}
  .flc{min-height:260px}
  .ff{min-height:260px;padding:24px 18px}
  .ff h3{font-size:1rem}
  .fctrl{gap:10px;width:100%}
  .fctrl .btn{flex:1;justify-content:center;padding:10px}
  .gc{max-width:100%}
  .gf{padding:20px}.gf h2{font-size:1.05rem}
  .fg label{font-size:.76rem}
  .fg input,.fg textarea,.fg select{font-size:16px;padding:10px 12px}
  .fg textarea{min-height:120px}
  .imp{max-width:100%}
  .drop{padding:30px 16px}
  .drop i{font-size:2rem;margin-bottom:10px}
  .drop h3{font-size:.92rem}.drop p{font-size:.78rem}
  .fm{margin-top:18px}
  .ii{padding:12px 14px;gap:10px}
  .ii .iic{width:34px;height:34px;font-size:.9rem}
  .ii .iii h4{font-size:.82rem}.ii .iii p{font-size:.68rem}
  .apikey-row{padding:8px 10px;gap:6px}
  .apikey-row .key-display{font-size:.72rem;letter-spacing:.5px}
  .apikey-row .btn-toggle,.apikey-row .btn-del{width:32px;height:32px}
  .addkey-btn,.import-keys-btn{padding:10px 14px;font-size:.78rem}
  .ni{padding:10px 14px;font-size:.84rem;min-height:44px}
  .sb-h{padding:10px 14px;font-size:.78rem;min-height:44px}
  .ta-fab{bottom:16px;right:16px;width:50px;height:50px;font-size:1.2rem}
  .ta-panel{width:calc(100vw - 24px);right:12px;bottom:78px;max-height:70vh}
  .ta-messages{max-height:50vh}
  .ta-input input{font-size:16px}
  .ai-welcome-grid{grid-template-columns:1fr}
  .ai-msg{max-width:90%}
  .ai-page{padding:0}
  .ai-header{padding:20px 16px 14px}
  .ai-chat{padding:0 14px 12px}
  .ai-bottom{padding:10px 14px 18px}

function toggleSidebarToggle() {
  if (window.innerWidth <= 768) {

var U = [
  { id: 'unit-1', n: 'Unit 1', t: 'The Role of Chemistry in Biology', tv: 'Vai trò của Hóa học trong Sinh học', ic: 'fas fa-flask', ch: [
    { id: 'ch-intro', t: 'Interview with Kenneth Olden', tv: 'Phỏng vấn Kenneth Olden', sec: [
      { id: 'intro', t: 'Introduction: Kenneth Olden Interview', tv: 'Giới thiệu: Phỏng vấn Kenneth Olden',
        en: '<p><strong>Dr. Kenneth Olden</strong> had a distinguished career in medical research and public health, serving as Director of the National Institute of Environmental Health Sciences (1991–2005) and founding Dean of the School of Public Health at CUNY (2008–2012). He published over <strong>220 research papers</strong> and received three of the most distinguished awards in public health.</p><p>His research focused on <span class="kt">fibronectin</span>, a glycoprotein present on the surface of normal cells but <strong>absent on cancer cells</strong>. Fibronectin is a glycoprotein — it has carbohydrates (sugars) attached to it. At the time, a hypothesis stated that carbohydrates were necessary for protein export from the cell.</p><p>Using the drug <span class="kt">tunicamycin</span> (which prevents carbohydrate attachment), Olden and Ken Yamada demonstrated that <strong>carbohydrates were NOT necessary for protein export</strong>, but instead were important for <strong>stabilizing the protein\'s structure</strong>. This became one of the most cited papers of 1978.</p><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Scientific Impact</h4><p>This research demonstrated how understanding molecular chemistry — specifically glycoprotein structure — directly advances cancer biology. Olden later founded the <strong>Environmental Genome Project</strong>, using genomics to determine susceptibility to environmental toxins, and established Children\'s Environmental Health and Disease Prevention Research Centers.</p></div><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Key Takeaway</h4><p>Chemistry is foundational to biology and medicine. Understanding molecular structure (like glycoproteins) enables breakthroughs in disease research, drug development, and public health policy.</p></div>',
        vi: '<p><strong>Tiến sĩ Kenneth Olden</strong> có sự nghiệp xuất sắc trong nghiên cứu y tế và sức khỏe cộng đồng, giữ chức vụ Viện trưởng Viện Sức khỏe Môi trường Quốc gia (1991–2005) và là Trưởng khoa Sáng lập Trường Y tế Công cộng tại CUNY (2008–2012). Ông xuất bản hơn <strong>220 bài báo nghiên cứu</strong> và nhận ba giải thưởng danh giá nhất trong y tế công cộng.</p><p>Nghiên cứu của ông tập trung vào <span class="kt">fibronectin</span>, một glycoprotein trên bề mặt tế bào bình thường nhưng <strong>vắng mặt trên tế bào ung thư</strong>. Fibronectin là một glycoprotein — có carbonhydrate (đường) gắn vào. Lúc đó, giả thuyết cho rằng carbonhydrate cần thiết cho vận chuyển protein ra khỏi tế bào.</p><p>Sử dụng thuốc <span class="kt">tunicamycin</span> (ngăn gắn carbonhydrate), Olden và Ken Yamada chứng minh rằng <strong>carbonhydrate KHÔNG cần thiết cho vận chuyển protein</strong>, mà lại quan trọng trong <strong>ổn định cấu trúc protein</strong>. Đây trở thành một trong những bài báo được trích dẫn nhiều nhất năm 1978.</p><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Tác động Khoa học</h4><p>Nghiên cứu này chứng minh hiểu biết hóa học phân tử — cụ thể cấu trúc glycoprotein — trực tiếp thúc đẩy sinh học ung thư. Olden sau đó thành lập <strong>Dự án Genome Môi trường</strong>, sử dụng genomics để xác định tính nhạy cảm với độc tố môi trường.</p></div><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Điểm Trọng tâm</h4><p>Hóa học là nền tảng cho sinh học và y khoa. Hiểu cấu trúc phân tử (như glycoprotein) cho phép đột phá trong nghiên cứu bệnh tật, phát triển thuốc và chính sách y tế công cộng.</p></div>' }
    ]},
    { id: 'ch2', t: 'Chapter 2: Atoms and Molecules', tv: 'Chương 2: Nguyên tử và Phân tử', sec: [
      { id: 'elements', t: 'Elements and Compounds', tv: 'Nguyên tố và Hợp chất',
        en: '<p><strong>Matter</strong> is anything that takes up space and has mass. Matter is made up of <span class="kt">elements</span> — substances that cannot be broken down to other substances by chemical reactions. There are <strong>92 naturally occurring elements</strong>; each has a symbol (e.g., Na from Latin <em>natrium</em> for sodium).</p><p>A <span class="kt">compound</span> is a substance consisting of two or more different elements combined in a <strong>fixed ratio</strong>. Compounds have <span class="kt">emergent properties</span> — characteristics different from those of their elements:</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Emergent Properties Example</h4><p>Pure sodium (Na) is a reactive metal. Pure chlorine (Cl) is a poisonous gas. Yet when combined in a 1:1 ratio, they form sodium chloride (NaCl) — ordinary, edible table salt. The compound has entirely different properties from its elements.</p></div><p><strong>Four elements make up approximately 96% of living matter:</strong></p><div class="fb">O (65.0%) · C (18.5%) · H (9.5%) · N (3.3%) = ~96.3%</div><p>The remaining ~3.7% includes:</p><div class="fb">Ca (1.5%) · P (1.0%) · K (0.4%) · S (0.3%) · Na (0.2%) · Cl (0.2%) · Mg (0.1%)</div><p>Of the 92 natural elements, about <strong>20–25% are essential elements</strong> that organisms need. Humans require 25; plants need only 17.</p><p><span class="kt">Trace elements</span> are required in only minute quantities but are still essential. For example, <strong>iodine (I)</strong> is needed for thyroid hormone production — only <strong>0.15 mg/day</strong> is adequate. Deficiency causes the thyroid gland to enlarge abnormally, a condition called <em>goiter</em>. Consuming seafood or iodized salt prevents this.</p><div class="cbx"><h4><i class="fas fa-exclamation-triangle"></i> Toxic Elements</h4><p>Some naturally occurring elements are toxic. <strong>Arsenic</strong> has been linked to numerous diseases and can be lethal. In southern Asia, millions have been exposed to arsenic-laden groundwater from drilled wells — a major ongoing public health crisis.</p></div>',
        vi: '<p><strong>Vật chất</strong> là bất kỳ thứ gì chiếm không gian và có khối lượng. Vật chất được tạo từ <span class="kt">nguyên tố</span> — chất không thể phân hủy thành chất khác bằng phản ứng hóa học. Có <strong>92 nguyên tố tự nhiên</strong>; mỗi nguyên tố có ký hiệu (vd: Na từ tiếng Latin <em>natrium</em> cho natri).</p><p>Một <span class="kt">hợp chất</span> là chất gồm hai hoặc nhiều nguyên tố kết hợp theo <strong>tỷ lệ cố định</strong>. Hợp chất có <span class="kt">tính chất nổi bật</span> — đặc điểm khác với nguyên tố cấu thành:</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Ví dụ Tính chất Nổi bật</h4><p>Natri (Na) nguyên chất là kim loại phản ứng mạnh. Clo (Cl) nguyên chất là khí độc. Khi kết hợp theo tỷ lệ 1:1, chúng tạo thành natri clorua (NaCl) — muối ăn bình thường. Hợp chất có tính chất hoàn toàn khác với nguyên tố.</p></div><p><strong>Bốn nguyên tố chiếm khoảng 96% vật chất sống:</strong></p><div class="fb">O (65,0%) · C (18,5%) · H (9,5%) · N (3,3%) = ~96,3%</div><p>Khoảng 3,7% còn lại bao gồm:</p><div class="fb">Ca (1,5%) · P (1,0%) · K (0,4%) · S (0,3%) · Na (0,2%) · Cl (0,2%) · Mg (0,1%)</div><p>Trong 92 nguyên tố tự nhiên, khoảng <strong>20–25% là nguyên tố thiết yếu</strong>. Con người cần 25; thực vật chỉ cần 17.</p><p><span class="kt">Vi lượng nguyên tố</span> chỉ cần số lượng rất nhỏ nhưng vẫn thiết yếu. Ví dụ, <strong>iốt (I)</strong> cần cho sản xuất hormone tuyến giáp — chỉ <strong>0,15 mg/ngày</strong> là đủ. Thiếu hụt gây tuyến giáp phình to, gọi là <em>bướu cổ</em>. Ăn hải sản hoặc muối iốt ngăn ngừa điều này.</p><div class="cbx"><h4><i class="fas fa-exclamation-triangle"></i> Nguyên tố Độc</h4><p>Một số nguyên tố tự nhiên có độc. <strong>Arsenic</strong> liên quan nhiều bệnh và có thể gây chết. Tại Nam Á, hàng triệu người đã tiếp xúc nước ngầm chứa arsenic từ giếng khoan — khủng hoảng y tế công cộng nghiêm trọng.</p></div>' },
      { id: 'atoms', t: 'Atomic Structure: Subatomic Particles', tv: 'Cấu trúc Nguyên tử: Các hạt cơ bản',
        en: '<p>An <span class="kt">atom</span> is the smallest unit of matter that still retains the properties of an element. Three <strong>subatomic particles</strong> are relevant:</p><div class="fb">Protons (+1 charge) · Neutrons (0 charge) · Electrons (−1 charge)</div><p><strong>Protons and neutrons</strong> are packed in the dense <span class="kt">atomic nucleus</span> at the center. Each has a mass of approximately <strong>1 dalton</strong> (1.7 × 10⁻²⁴ g). <strong>Electrons</strong> form a "cloud" of negative charge around the nucleus — their mass is only ~1/2,000 of a proton, so they\'re negligible for mass calculations.</p><p><strong>Key numbers for every atom:</strong></p><div class="fb">Atomic Number (Z) = number of protons = element identity<br>Mass Number (A) = protons + neutrons<br>Neutrons = A − Z</div><p><strong>Example — Sodium (Na):</strong></p><div class="fb">²³₁₁Na → Z = 11 protons, A = 23<br>Neutrons = 23 − 11 = 12<br>Electrons = 11 (in neutral atom)</div><p><strong>Electron Shells and Energy Levels:</strong></p><p>Electrons exist at fixed energy levels called <span class="kt">electron shells</span>. Each shell has a maximum capacity:</p><div class="fb">1st shell: max 2 electrons (closest to nucleus, lowest energy)<br>2nd shell: max 8 electrons<br>3rd shell: max 8 electrons (in simplified model)</div><p>The outermost occupied shell is the <span class="kt">valence shell</span>, and its electrons are <span class="kt">valence electrons</span>. These determine chemical behavior — atoms with incomplete valence shells are <strong>chemically reactive</strong>. Atoms with full valence shells (He, Ne, Ar) are <strong>inert/unreactive</strong>.</p><p><strong>Electron Orbitals:</strong> Each shell contains orbitals — 3D spaces where electrons are found 90% of the time. The first shell has one spherical <em>s</em> orbital (1s). The second shell has one 2s orbital + three dumbbell-shaped <em>2p</em> orbitals (at right angles). Each orbital holds max <strong>2 electrons</strong>.</p><img src="images/electron_shells.png" alt="Electron Distribution Diagrams for C, N, O, Na" style="width:100%;border-radius:12px;margin:14px 0"><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Why This Matters</h4><p>Valence electrons determine bonding. Carbon has 4 valence electrons → forms 4 bonds. Oxygen has 6 → needs 2 more → forms 2 bonds. This is why carbon is the backbone of biological molecules.</p></div>',
        vi: '<p>Một <span class="kt">nguyên tử</span> là đơn vị nhỏ nhất của vật chất vẫn giữ được tính chất nguyên tố. Ba <strong>hạt cơ bản</strong> quan trọng:</p><div class="fb">Proton (điện tích +1) · Neutron (điện tích 0) · Electron (điện tích −1)</div><p><strong>Proton và neutron</strong> nằm trong <span class="kt">hạt nhân nguyên tử</span> dày đặc ở trung tâm. Mỗi hạt có khối lượng khoảng <strong>1 dalton</strong> (1,7 × 10⁻²⁴ g). <strong>Electron</strong> tạo "đám mây" điện âm quanh hạt nhân — khối lượng chỉ ~1/2.000 proton, bỏ qua khi tính khối lượng.</p><p><strong>Các số quan trọng cho mọi nguyên tử:</strong></p><div class="fb">Số nguyên tử (Z) = số proton = danh tính nguyên tố<br>Số khối (A) = proton + neutron<br>Neutron = A − Z</div><p><strong>Ví dụ — Natri (Na):</strong></p><div class="fb">²³₁₁Na → Z = 11 proton, A = 23<br>Neutron = 23 − 11 = 12<br>Electron = 11 (nguyên tử trung hòa)</div><p><strong>Lớp vỏ Electron và Mức năng lượng:</strong></p><p>Electron tồn tại ở mức năng lượng cố định gọi là <span class="kt">lớp vỏ electron</span>. Mỗi lớp có sức chứa tối đa:</p><div class="fb">Lớp 1: tối đa 2 electron (gần hạt nhân nhất, năng lượng thấp nhất)<br>Lớp 2: tối đa 8 electron<br>Lớp 3: tối đa 8 electron (mô hình đơn giản)</div><p>Lớp ngoài cùng được chiếm là <span class="kt">lớp vỏ hóa trị</span>, electron của nó là <span class="kt">electron hóa trị</span>. Chúng quyết định hành vi hóa học — nguyên tử có lớp vỏ hóa trị chưa đầy là <strong>hoạt động hóa học</strong>. Nguyên tử đầy lớp vỏ (He, Ne, Ar) là <strong>trơ/không phản ứng</strong>.</p><p><strong>Quỹ đạo Electron:</strong> Mỗi lớp chứa quỹ đạo — không gian 3D nơi electron ở 90% thời gian. Lớp 1 có một quỹ đạo cầu <em>s</em> (1s). Lớp 2 có một quỹ đạo 2s + ba quỹ đạo hình quả tạ <em>2p</em> (vuông góc). Mỗi quỹ đạo chứa tối đa <strong>2 electron</strong>.</p><img src="images/electron_shells.png" alt="Sơ đồ phân bố Electron cho C, N, O, Na" style="width:100%;border-radius:12px;margin:14px 0"><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Tại sao Quan trọng</h4><p>Electron hóa trị quyết định liên kết. Carbon có 4 electron hóa trị → tạo 4 liên kết. Oxy có 6 → cần thêm 2 → tạo 2 liên kết. Đây là lý do carbon là xương sống của phân tử sinh học.</p></div>' },
      { id: 'isotopes', t: 'Isotopes and Radioactive Decay', tv: 'Đồng vị và Phóng xạ',
        en: '<p><span class="kt">Isotopes</span> are different atomic forms of the same element — they have the <strong>same number of protons but different numbers of neutrons</strong>, and therefore different masses. They behave identically in chemical reactions.</p><p><strong>Carbon isotopes example:</strong></p><div class="fb">¹²C (6p + 6n) — 99% of carbon — stable<br>¹³C (6p + 7n) — ~1% of carbon — stable<br>¹⁴C (6p + 8n) — trace amounts — RADIOACTIVE</div><p>A <span class="kt">radioactive isotope</span> has an unstable nucleus that decays spontaneously, giving off particles and energy. When ¹⁴C decays, a neutron converts to a proton, transforming the carbon atom into nitrogen (¹⁴N).</p><p><strong>Half-life:</strong> The <span class="kt">half-life</span> is the time it takes for 50% of a radioactive isotope to decay. Each isotope has a characteristic, fixed half-life unaffected by temperature or pressure.</p><div class="fb">¹⁴C half-life = 5,730 years (useful for fossils up to ~75,000 years)<br>²³⁸U half-life = 4.5 billion years (used to date moon rocks)</div><img src="images/decay_curve.png" alt="Radioactive Decay Curve of Carbon-14" style="width:100%;border-radius:12px;margin:14px 0"><p><strong>Medical Application — PET Scans:</strong></p><p><span class="kt">PET</span> (Positron Emission Tomography) uses radioactively labeled glucose. Cancer cells have <strong>high metabolic activity</strong> and absorb more glucose than normal cells. The radioactive tracer reveals these "hot spots," allowing doctors to locate tumors.</p><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Clinical Applications</h4><p><strong>Radioactive tracers</strong> are used in medicine: kidney disorders are diagnosed by injecting labeled substances and analyzing excreted urine. PET scans monitor cancer growth and metabolism. <strong>Radiometric dating</strong> measures isotope ratios in fossils to determine their age — the ratio of ¹⁴C to ¹²C reveals how long since the organism died.</p></div><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Safety Note</h4><p>While medical doses of radioisotopes are relatively safe, radiation from decaying isotopes can damage cellular molecules. The severity depends on the type and amount of radiation absorbed.</p></div>',
        vi: '<p><span class="kt">Đồng vị</span> là dạng nguyên tử khác nhau của cùng nguyên tố — chúng có <strong>cùng số proton nhưng khác số neutron</strong>, do đó khối lượng khác nhau. Chúng hoạt động giống hệt trong phản ứng hóa học.</p><p><strong>Ví dụ đồng vị Carbon:</strong></p><div class="fb">¹²C (6p + 6n) — 99% carbon — ổn định<br>¹³C (6p + 7n) — ~1% carbon — ổn định<br>¹⁴C (6p + 8n) — lượng rất nhỏ — PHÓNG XẠ</div><p><span class="kt">Đồng vị phóng xạ</span> có hạt nhân không ổn định phân rã tự phát, phát ra hạt và năng lượng. Khi ¹⁴C phân rã, neutron chuyển thành proton, biến nguyên tử carbon thành nitơ (¹⁴N).</p><p><strong>Bán rã:</strong> <span class="kt">Bán rã</span> là thời gian để 50% đồng vị phóng xạ phân rã. Mỗi đồng vị có bán rã đặc trưng, cố định, không bị ảnh hưởng bởi nhiệt độ hay áp suất.</p><div class="fb">¹⁴C bán rã = 5.730 năm (hóa thạch đến ~75.000 năm)<br>²³⁸U bán rã = 4,5 tỷ năm (đá mặt trăng)</div><img src="images/decay_curve.png" alt="Đường cong phân rã phóng xạ Carbon-14" style="width:100%;border-radius:12px;margin:14px 0"><p><strong>Ứng dụng Y tế — PET Scan:</strong></p><p><span class="kt">PET</span> (Chụp cắt lớp phát xạ positron) sử dụng glucose đánh dấu phóng xạ. Tế bào ung thư có <strong>hoạt động chuyển hóa cao</strong> và hấp thụ nhiều glucose hơn tế bào bình thường. Chất đánh dấu tiết lộ các "điểm nóng," cho phép bác sĩ xác định vị trí khối u.</p><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Ứng dụng Lâm sàng</h4><p><strong>Chất đánh dấu phóng xạ</strong> được dùng trong y tế: rối loạn thận được chẩn đoán bằng tiêm chất đánh nhãn và phân tích nước tiểu. PET scan theo dõi tăng trưởng và chuyển hóa ung thư. <strong>Đo tuổi phóng xạ</strong> đo tỷ lệ đồng vị trong hóa thạch — tỷ lệ ¹⁴C/¹²C cho biết sinh vật chết bao lâu.</p></div>' },
      { id: 'bonds', t: 'Chemical Bonding: Covalent and Ionic', tv: 'Liên kết Hóa học: Cộng hóa trị và Ion',
        en: '<p>Atoms with incomplete valence shells interact to complete them — either by <strong>sharing</strong> or <strong>transferring</strong> valence electrons. These interactions create <span class="kt">chemical bonds</span>.</p><h4 style="color:var(--ac1);margin:16px 0 8px">Covalent Bonds</h4><p>A <span class="kt">covalent bond</span> forms when two atoms <strong>share a pair of valence electrons</strong>. When two hydrogen atoms approach, their 1s orbitals overlap, and they share electrons — each atom now has 2 electrons (completed first shell).</p><div class="fb">Single bond: H—H (1 shared pair) · Double bond: O═O (2 shared pairs)<br>Valence = bonding capacity: H = 1, O = 2, N = 3, C = 4</div><p><strong>Electronegativity</strong> = an atom\'s attraction for shared electrons in a covalent bond.</p><p><span class="kt">Nonpolar covalent bond</span>: electrons shared equally (same electronegativity). Examples: H₂, O₂.</p><p><span class="kt">Polar covalent bond</span>: electrons pulled toward the more electronegative atom. In water (H₂O):</p><div class="fb">Oxygen is highly electronegative → pulls electrons toward itself<br>→ δ⁻ (partial negative) on Oxygen<br>→ δ⁺ (partial positive) on each Hydrogen</div><img src="images/polar_bonds.png" alt="Polar vs Nonpolar Covalent Bonds" style="width:100%;border-radius:12px;margin:14px 0"><h4 style="color:var(--ac1);margin:16px 0 8px">Ionic Bonds</h4><p>An <span class="kt">ionic bond</span> forms when one atom completely <strong>transfers</strong> an electron to another.</p><div class="fb">Na (2-8-1) → loses 1e⁻ → Na⁺ (cation, positive)<br>Cl (2-8-7) → gains 1e⁻ → Cl⁻ (anion, negative)<br>Opposite charges attract → ionic bond → NaCl</div><img src="images/ionic_bond.png" alt="Formation of Ionic Bond: NaCl" style="width:100%;border-radius:12px;margin:14px 0"><p><strong>Salt crystals:</strong> NaCl is NOT a molecule — it\'s a 3D lattice of alternating Na⁺ and Cl⁻ ions. The formula NaCl indicates only the <strong>ratio</strong> (1:1).</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Key Concept: Dry vs Wet</h4><p>In a <strong>dry crystal</strong>, ionic bonds are very strong (needs a hammer to break). In <strong>water</strong>, ionic bonds are much weaker because each ion is shielded by a hydration shell of water molecules. This is why <strong>drugs are manufactured as salts</strong> — stable when dry, but dissolve easily in body fluids.</p></div><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Medical Relevance</h4><p>Electrolyte balance (Na⁺, K⁺, Ca²⁺, Cl⁻) is critical for cardiac function, nerve impulses, and muscle contraction. IV fluids carefully replicate blood electrolyte concentrations.</p></div>',
        vi: '<p>Nguyên tử có lớp vỏ hóa trị chưa đầy tương tác để hoàn thiện — bằng <strong>chia sẻ</strong> hoặc <strong>truyền</strong> electron hóa trị, tạo ra <span class="kt">liên kết hóa học</span>.</p><h4 style="color:var(--ac1);margin:16px 0 8px">Liên kết Cộng hóa trị</h4><p><span class="kt">Liên kết cộng hóa trị</span> hình thành khi hai nguyên tử <strong>chia sẻ cặp electron hóa trị</strong>. Khi hai nguyên tử hydro tiếp cận, quỹ đạo 1s chồng lấp, chia sẻ electron — mỗi nguyên tử có 2 electron (hoàn thiện lớp 1).</p><div class="fb">Liên kết đơn: H—H (1 cặp chia sẻ) · Liên kết đôi: O═O (2 cặp)<br>Hóa trị: H = 1, O = 2, N = 3, C = 4</div><p><strong>Độ âm điện</strong> = lực hút electron chia sẻ của nguyên tử trong liên kết cộng hóa trị.</p><p><span class="kt">Liên kết cộng hóa trị không cực</span>: electron chia đều (cùng độ âm điện). Ví dụ: H₂, O₂.</p><p><span class="kt">Liên kết cộng hóa trị có cực</span>: electron bị kéo về nguyên tử âm điện hơn. Trong nước (H₂O):</p><div class="fb">Oxy rất âm điện → kéo electron về phía mình<br>→ δ⁻ (điện tích âm từng phần) trên Oxy<br>→ δ⁺ (điện tích dương từng phần) trên mỗi Hydro</div><img src="images/polar_bonds.png" alt="Liên kết cộng hóa trị Cực vs Không cực" style="width:100%;border-radius:12px;margin:14px 0"><h4 style="color:var(--ac1);margin:16px 0 8px">Liên kết Ion</h4><p><span class="kt">Liên kết ion</span> hình thành khi nguyên tử <strong>truyền hoàn toàn</strong> electron cho nguyên tử khác.</p><div class="fb">Na (2-8-1) → mất 1e⁻ → Na⁺ (cation, dương)<br>Cl (2-8-7) → nhận 1e⁻ → Cl⁻ (anion, âm)<br>Điện tích đối lập hút nhau → liên kết ion → NaCl</div><img src="images/ionic_bond.png" alt="Hình thành Liên kết Ion: NaCl" style="width:100%;border-radius:12px;margin:14px 0"><p><strong>Tinh thể muối:</strong> NaCl KHÔNG phải phân tử — là mạng lưới 3D xen kẽ Na⁺ và Cl⁻. Công thức NaCl chỉ ra <strong>tỷ lệ</strong> (1:1).</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Khái niệm Trọng tâm: Khô vs Ướt</h4><p>Trong <strong>tinh thể khô</strong>, liên kết ion rất mạnh (cần búa để phá). Trong <strong>nước</strong>, liên kết ion yếu hơn nhiều vì mỗi ion được bọc bởi vỏ hydrat. Đây là lý do <strong>thuốc sản xuất dạng muối</strong> — ổn định khi khô, tan dễ trong dịch cơ thể.</p></div><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Ý nghĩa Y khoa</h4><p>Cân bằng điện giải (Na⁺, K⁺, Ca²⁺, Cl⁻) thiết yếu cho chức năng tim, xung thần kinh và co cơ. Dịch truyền tĩnh mạch tái tạo chính xác nồng độ điện giải máu.</p></div>' },
      { id: 'weak', t: 'Weak Interactions and Molecular Shape', tv: 'Tương tác Yếu và Hình dạng Phân tử',
        en: '<p>While covalent and ionic bonds are the strongest, <strong>weak interactions</strong> are indispensable for life — they reinforce molecular shapes, allow temporary molecular recognition, and are reversible.</p><h4 style="color:var(--ac1);margin:16px 0 8px">Hydrogen Bonds</h4><p>A <span class="kt">hydrogen bond</span> forms when a partially positive hydrogen (δ⁺, bonded to an electronegative atom) is attracted to a nearby electronegative atom (δ⁻, usually O or N). Strength: approximately <strong>1/20 of a covalent bond</strong> individually, but <strong>collectively powerful</strong> when many act together.</p><img src="images/water_hbonds.png" alt="Hydrogen Bonding Network in Water" style="width:100%;border-radius:12px;margin:14px 0"><h4 style="color:var(--ac1);margin:16px 0 8px">Van der Waals Interactions</h4><p><span class="kt">Van der Waals interactions</span> are temporary attractions between transiently charged regions of molecules. Even nonpolar molecules experience these because electrons momentarily accumulate in one region. Individually the weakest interaction, but collectively significant.</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Gecko Example</h4><p>Gecko lizards walk up walls using van der Waals interactions! Their toes have hundreds of thousands of tiny hairs, each with multiple projections, maximizing surface contact. The cumulative van der Waals forces support the gecko\'s entire body weight.</p></div><h4 style="color:var(--ac1);margin:16px 0 8px">Molecular Shape Determines Function</h4><p>Covalent bonds produce <span class="kt">hybrid orbitals</span> that determine molecular shape:</p><div class="fb">Water (H₂O): V-shape, 104.5° bond angle<br>(2 bonding pairs + 2 lone pairs → distorted tetrahedron)<br><br>Methane (CH₄): Tetrahedral, 109.5° bond angle<br>(4 bonding pairs → perfect tetrahedron)</div><p><strong>Molecular mimicry — morphine and endorphins:</strong></p><p>Brain cells have receptors for <span class="kt">endorphins</span> — natural signaling molecules that relieve pain. Opiates like <strong>morphine</strong> have shapes similar to endorphins, allowing them to bind the same receptors. This is why both produce similar effects (pain relief, euphoria). <em>Shape determines function.</em></p><img src="images/molecular_mimicry.png" alt="Molecular Mimicry: Morphine and Endorphins" style="width:100%;border-radius:12px;margin:14px 0"><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Pharmacology</h4><p>Drug design relies entirely on molecular shape complementarity — a drug must fit its target receptor like a key fits a lock. This principle is the core of pharmacology and toxicology.</p></div>',
        vi: '<p>Trong khi liên kết cộng hóa trị và ion là mạnh nhất, <strong>tương tác yếu</strong> không thể thiếu cho sự sống — chúng củng cố hình dạng phân tử, cho phép nhận diện phân tử tạm thời, và có tính thuận nghịch.</p><h4 style="color:var(--ac1);margin:16px 0 8px">Liên kết Hydro</h4><p><span class="kt">Liên kết hydro</span> hình thành khi hydro mang điện dương từng phần (δ⁺, liên kết với nguyên tử âm điện) bị hút bởi nguyên tử âm điện gần đó (δ⁻, thường O hoặc N). Sức mạnh: khoảng <strong>1/20 liên kết cộng hóa trị</strong>, nhưng <strong>tổng hợp rất mạnh</strong>.</p><img src="images/water_hbonds.png" alt="Mạng lưới Liên kết Hydro trong Nước" style="width:100%;border-radius:12px;margin:14px 0"><h4 style="color:var(--ac1);margin:16px 0 8px">Tương tác Van der Waals</h4><p><span class="kt">Tương tác Van der Waals</span> là lực hút tạm thời giữa vùng tích điện nhất thời. Ngay cả phân tử không cực cũng có vì electron tích tụ tạm ở một vùng. Yếu nhất đơn lẻ, nhưng tổng hợp đáng kể.</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Ví dụ Tắc kè</h4><p>Tắc kè đi lên tường nhờ tương tác Van der Waals! Ngón chân có hàng trăm nghìn lông nhỏ, mỗi lông có nhiều nhô ra, tối đa hóa diện tích tiếp xúc. Tổng lực Van der Waals đỡ toàn bộ trọng lượng cơ thể.</p></div><h4 style="color:var(--ac1);margin:16px 0 8px">Hình dạng Phân tử Quyết định Chức năng</h4><p>Liên kết cộng hóa trị tạo <span class="kt">quỹ đạo lai</span> quyết định hình dạng:</p><div class="fb">Nước (H₂O): Hình chữ V, góc 104,5°<br>(2 cặp liên kết + 2 cặp đơn → tứ diện méo)<br><br>Metan (CH₄): Tứ diện, góc 109,5°<br>(4 cặp liên kết → tứ diện hoàn hảo)</div><p><strong>Bắt chước phân tử — morphine và endorphin:</strong></p><p>Tế bào não có thụ thể cho <span class="kt">endorphin</span> — phân tử tín hiệu tự nhiên giảm đau. Thuốc phiện như <strong>morphine</strong> có hình dạng tương tự endorphin, liên kết cùng thụ thể. <em>Hình dạng quyết định chức năng.</em></p><img src="images/molecular_mimicry.png" alt="Bắt chước Phân tử: Morphine và Endorphin" style="width:100%;border-radius:12px;margin:14px 0"><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Dược lý</h4><p>Thiết kế thuốc dựa hoàn toàn vào tương thích hình dạng — thuốc phải vừa thụ thể như chìa vừa ổ khóa. Nguyên tắc này là cốt lõi dược lý và độc chất học.</p></div>' },
      { id: 'reactions', t: 'Chemical Reactions and Equilibrium', tv: 'Phản ứng Hóa học và Cân bằng',
        en: '<p><span class="kt">Chemical reactions</span> make and break chemical bonds, leading to changes in the composition of matter. The starting materials are <strong>reactants</strong>; the resulting materials are <strong>products</strong>.</p><div class="fb">2H₂ + O₂ → 2H₂O<br>Reactants → Products</div><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Conservation of Matter</h4><p>Matter is CONSERVED in chemical reactions — atoms are rearranged, never created or destroyed. All atoms in the reactants must be accounted for in the products.</p></div><p><strong>Photosynthesis</strong> — a key biological reaction:</p><div class="fb">6CO₂ + 6H₂O + Sunlight → C₆H₁₂O₆ + 6O₂<br>Carbon dioxide + Water → Glucose + Oxygen</div><p>This reaction rearranges atoms from CO₂ and H₂O into glucose and oxygen, powered by sunlight.</p><p><strong>Reversible Reactions:</strong> All chemical reactions are theoretically reversible. Example: N₂ + 3H₂ ⇌ 2NH₃.</p><p><span class="kt">Chemical equilibrium</span> is reached when the forward and reverse reaction rates are equal. This is a <strong>dynamic state</strong> — reactions continue in both directions, but concentrations stabilize. Equilibrium does NOT mean equal concentrations — only that their ratio is constant.</p><p><strong>Concentration affects rate:</strong> More reactant molecules → more collisions → faster reaction. As products accumulate, the reverse reaction speeds up until equilibrium is reached.</p>',
        vi: '<p><span class="kt">Phản ứng hóa học</span> tạo và phá liên kết hóa học, dẫn đến thay đổi thành phần vật chất. Chất ban đầu là <strong>chất phản ứng</strong>; chất kết quả là <strong>sản phẩm</strong>.</p><div class="fb">2H₂ + O₂ → 2H₂O<br>Chất phản ứng → Sản phẩm</div><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Bảo toàn Vật chất</h4><p>Vật chất ĐƯỢC BẢO TOÀN trong phản ứng hóa học — nguyên tử sắp xếp lại, không bao giờ tạo ra hay phá hủy.</p></div><p><strong>Quang hợp</strong> — phản ứng sinh học quan trọng:</p><div class="fb">6CO₂ + 6H₂O + Ánh sáng → C₆H₁₂O₆ + 6O₂<br>Carbon dioxide + Nước → Glucose + Oxy</div><p>Phản ứng sắp xếp lại nguyên tử từ CO₂ và H₂O thành glucose và oxy, năng lượng từ ánh sáng.</p><p><strong>Phản ứng thuận nghịch:</strong> Mọi phản ứng hóa học đều thuận nghịch. Ví dụ: N₂ + 3H₂ ⇌ 2NH₃.</p><p><span class="kt">Cân bằng hóa học</span> đạt được khi tốc độ thuận và nghịch bằng nhau. Đây là <strong>trạng thái động</strong> — phản ứng tiếp tục cả hai hướng, nhưng nồng độ ổn định. Cân bằng KHÔNG có nghĩa nồng độ bằng nhau — chỉ tỷ lệ là hằng số.</p><p><strong>Nồng độ ảnh hưởng tốc độ:</strong> Nhiều chất phản ứng hơn → nhiều va chạm hơn → phản ứng nhanh hơn.</p>' }
    ]},
    { id: 'ch3', t: 'Chapter 3: The Chemistry of Water', tv: 'Chương 3: Hóa học của Nước', sec: [
      { id: 'wstruct', t: 'Water Structure and Hydrogen Bonding', tv: 'Cấu trúc Nước và Liên kết Hydro',
        en: '<p>Water (H₂O) is a <span class="kt">polar molecule</span> — its overall charge is unevenly distributed. It is shaped like a wide <strong>V</strong> with a bond angle of <strong>104.5°</strong>, caused by 2 bonding electron pairs + 2 lone (unbonded) electron pairs on oxygen.</p><div class="fb">O is more electronegative than H<br>→ Electrons spend more time near O<br>→ δ⁻ on Oxygen | δ⁺ on each Hydrogen</div><p>The partially positive hydrogen of one water molecule is attracted to the partially negative oxygen of a nearby molecule. This attraction is a <span class="kt">hydrogen bond</span>.</p><p><strong>Properties of hydrogen bonds in liquid water:</strong></p><ul><li>Strength: ~1/20 of a covalent bond</li><li>Each bond lasts only a few <strong>trillionths of a second</strong></li><li>Constantly <strong>breaking and reforming</strong> with new partners</li><li>At any instant, each water molecule is H-bonded to ~4 neighbors</li><li>At any instant, most water molecules are linked by multiple H-bonds</li></ul><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Key Insight</h4><p>Hydrogen bonds are individually very weak and transient. But their collective effect — millions of H-bonds constantly forming in a sample of water — gives water ALL of its extraordinary, life-supporting properties. Every property of water described in this chapter traces back to hydrogen bonding.</p></div>',
        vi: '<p>Nước (H₂O) là <span class="kt">phân tử cực</span> — điện tích tổng thể phân bố không đều. Hình chữ <strong>V</strong> rộng với góc liên kết <strong>104,5°</strong>, do 2 cặp electron liên kết + 2 cặp electron đơn trên oxy.</p><div class="fb">O âm điện hơn H<br>→ Electron ở gần O nhiều hơn<br>→ δ⁻ trên Oxy | δ⁺ trên mỗi Hydro</div><p>Hydro mang điện dương từng phần của phân tử nước này bị hút bởi oxy mang điện âm từng phần của phân tử gần đó. Lực hút này là <span class="kt">liên kết hydro</span>.</p><p><strong>Tính chất liên kết hydro trong nước lỏng:</strong></p><ul><li>Sức mạnh: ~1/20 liên kết cộng hóa trị</li><li>Mỗi liên kết chỉ tồn tại vài <strong>phần nghìn tỷ giây</strong></li><li>Liên tục <strong>phá vỡ và tái tạo</strong> với đối tác mới</li><li>Tại bất kỳ thời điểm, mỗi phân tử nước liên kết hydro với ~4 phân tử lân cận</li></ul><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Hiểu biết Cốt lõi</h4><p>Liên kết hydro đơn lẻ rất yếu và thoáng qua. Nhưng tác dụng tổng hợp — hàng triệu liên kết hydro liên tục hình thành — mang lại cho nước TẤT CẢ tính chất phi thường hỗ trợ sự sống.</p></div>' },
      { id: 'cohesion', t: 'Cohesion, Surface Tension, and Adhesion', tv: 'Sự kết dính, Sức căng bề mặt, và Bám dính',
        en: '<p><span class="kt">Cohesion</span>: Water molecules stay close together due to hydrogen bonding. This makes water more structured than most other liquids.</p><p><span class="kt">Surface tension</span>: At the air-water interface, water molecules are hydrogen-bonded to each other and to the water below, but NOT to the air above. This asymmetry creates high surface tension — an "invisible film" on the surface. Spiders and some insects can <strong>walk on water</strong> because of surface tension.</p><p><span class="kt">Adhesion</span>: Water clinging to other substances (like cell walls) via hydrogen bonds.</p><p><strong>Transpiration Pull — Water Transport in Trees:</strong></p><p>Cohesion + adhesion together enable water transport against gravity in plants:</p><ol><li><strong>Evaporation</strong> from leaves pulls water molecules upward</li><li><strong>Cohesion</strong> (H-bonds between water molecules) transmits the pull downward through the column of water</li><li><strong>Adhesion</strong> (H-bonds between water and cell walls) counteracts gravity</li></ol><p>This mechanism can transport water <strong>over 100 meters</strong> in the tallest trees — approximately one-quarter the height of the Empire State Building!</p><img src="images/transpiration_pull.png" alt="Transpiration Pull: Water Transport in Plants" style="width:100%;border-radius:12px;margin:14px 0"><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Clinical Significance</h4><p>Cohesion and adhesion are essential for <strong>capillary action</strong> in blood vessels — allowing blood to flow through tiny capillaries.</p></div>',
        vi: '<p><span class="kt">Sự kết dính</span>: Phân tử nước ở gần nhau nhờ liên kết hydro, làm nước có cấu trúc hơn hầu hết chất lỏng.</p><p><span class="kt">Sức căng bề mặt</span>: Tại giao diện khí-nước, phân tử nước liên kết hydro với nhau và với nước bên dưới, nhưng KHÔNG với không khí. Sự bất đối xứng tạo sức căng bề mặt cao — "màng vô hình." Nhện và côn trùng có thể <strong>đi trên nước</strong>.</p><p><span class="kt">Sự bám dính</span>: Nước bám vào chất khác (như thành tế bào) qua liên kết hydro.</p><p><strong>Kéo thoát hơi — Vận chuyển Nước trong Cây:</strong></p><ol><li><strong>Bay hơi</strong> từ lá kéo phân tử nước lên</li><li><strong>Kết dính</strong> (liên kết H giữa phân tử nước) truyền lực kéo xuống dưới</li><li><strong>Bám dính</strong> (liên kết H giữa nước và thành tế bào) chống trọng lực</li></ol><p>Cơ chế này vận chuyển nước <strong>hơn 100 mét</strong> trong cây cao nhất!</p><img src="images/transpiration_pull.png" alt="Kéo thoát hơi: Vận chuyển Nước trong Cây" style="width:100%;border-radius:12px;margin:14px 0"><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Ý nghĩa Lâm sàng</h4><p>Kết dính và bám dính thiết yếu cho <strong>hoạt động mao dẫn</strong> trong mạch máu.</p></div>' },
      { id: 'temp', t: 'Specific Heat and Evaporative Cooling', tv: 'Nhiệt dung riêng và Làm mát Bay hơi',
        en: '<p><strong>Temperature</strong> = average kinetic energy of molecules. <strong>Thermal energy</strong> = total kinetic energy (depends on volume). <strong>Heat</strong> = thermal energy transferred between objects of different temperature.</p><p><strong>Calorie (cal):</strong> The amount of heat to raise 1 g of water by 1°C. <strong>Kilocalorie (kcal):</strong> 1,000 cal. (Food "Calories" are actually kcal.)</p><p><span class="kt">Specific heat</span> = heat needed to raise 1 g of a substance by 1°C.</p><div class="fb">Water: 1 cal/(g·°C) — unusually HIGH<br>Ethyl alcohol: 0.6 cal/(g·°C)<br>Iron: ~0.1 cal/(g·°C)</div><p><strong>WHY is water\'s specific heat so high?</strong> Because heat energy must first <strong>break hydrogen bonds</strong> before molecules speed up (temperature rises). Much of the absorbed heat goes into disrupting H-bonds, not increasing molecular speed.</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Practical Example</h4><p>You can burn your fingers on an iron pot on the stove while the water inside is still lukewarm — iron\'s specific heat is 10× lower than water\'s.</p></div><p><strong>Biological significance:</strong> Oceans absorb huge amounts of solar heat while warming only a few degrees, then release heat at night, moderating <strong>coastal temperatures</strong>.</p><p><strong>Evaporative Cooling:</strong></p><p><span class="kt">Heat of vaporization</span> = heat needed to convert 1 g of liquid to gas. For water: <strong>580 cal/g</strong> at 25°C — nearly double that of alcohol or ammonia.</p><p><span class="kt">Evaporative cooling</span> occurs because the "hottest" (fastest) molecules are most likely to leave as gas, reducing the average kinetic energy of remaining molecules.</p><div class="fb">Sweating → evaporation cools skin<br>Plant leaves → evaporation cools tissue<br>Elephants → spray water on themselves to cool down</div>',
        vi: '<p><strong>Nhiệt độ</strong> = động năng trung bình của phân tử. <strong>Nhiệt năng</strong> = tổng động năng (phụ thuộc thể tích). <strong>Nhiệt</strong> = năng lượng nhiệt truyền giữa vật có nhiệt độ khác nhau.</p><p><strong>Calorie (cal):</strong> Nhiệt lượng nâng 1 g nước lên 1°C. <strong>Kilocalorie (kcal):</strong> 1.000 cal. ("Calories" thực phẩm thực ra là kcal.)</p><p><span class="kt">Nhiệt dung riêng</span> = nhiệt cần để nâng 1 g chất lên 1°C.</p><div class="fb">Nước: 1 cal/(g·°C) — CAO bất thường<br>Ethyl alcohol: 0,6 cal/(g·°C)<br>Sắt: ~0,1 cal/(g·°C)</div><p><strong>TẠI SAO nhiệt dung riêng nước cao?</strong> Vì năng lượng nhiệt phải <strong>phá liên kết hydro trước</strong> rồi phân tử mới nhanh hơn.</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Ví dụ Thực tế</h4><p>Bạn có thể bỏng tay khi chạm nồi sắt trên bếp trong khi nước bên trong vẫn ấm — nhiệt dung riêng sắt thấp hơn nước 10 lần.</p></div><p><strong>Ý nghĩa sinh học:</strong> Đại dương hấp thụ nhiệt mặt trời khổng lồ chỉ ấm vài độ, rồi giải phóng nhiệt ban đêm, điều hòa <strong>nhiệt độ ven biển</strong>.</p><p><strong>Làm mát Bay hơi:</strong></p><p><span class="kt">Nhiệt hóa hơi</span> = nhiệt cần để chuyển 1 g lỏng thành khí. Nước: <strong>580 cal/g</strong> ở 25°C.</p><p><span class="kt">Làm mát bay hơi</span> xảy ra vì phân tử "nóng nhất" rời đi dưới dạng khí, giảm động năng trung bình.</p><div class="fb">Đổ mồ hôi → bay hơi làm mát da<br>Lá cây → bay hơi làm mát mô<br>Voi → xịt nước lên mình để làm mát</div>' },
      { id: 'ice', t: 'Ice Floating and Density Anomaly', tv: 'Băng nổi và Bất thường Khối lượng riêng',
        en: '<p>Water is one of the few substances that is <strong>less dense as a solid than as a liquid</strong>. This is caused by hydrogen bonding.</p><p><strong>What happens as water cools:</strong></p><ul><li>Above <strong>4°C</strong>: water behaves normally — expands when warmed, contracts when cooled</li><li><strong>4°C</strong>: water reaches maximum density</li><li>Below <strong>4°C to 0°C</strong>: molecules slow down, more H-bonds become stable</li><li>At <strong>0°C</strong>: molecules lock into a <span class="kt">crystalline lattice</span> — each molecule H-bonded to 4 partners</li></ul><p>The H-bonds keep molecules at "arm\'s length" — <strong>farther apart</strong> than in liquid water:</p><div class="fb">Ice is ~10% less dense than liquid water at 4°C<br>(10% fewer molecules in the same volume)</div><img src="images/ice_vs_liquid.png" alt="Why Ice Floats: Ice vs Liquid Water Structure" style="width:100%;border-radius:12px;margin:14px 0"><p><strong>Biological significance:</strong> Floating ice <strong>insulates the water below</strong>, preventing it from freezing solid. If ice were denser and sank, ponds, lakes, and even oceans could freeze from bottom up — life as we know it would be impossible.</p><div class="cbx"><h4><i class="fas fa-exclamation-triangle"></i> Climate Change Impact</h4><p>Arctic average air temperature rose <strong>2.2°C since 1961</strong>. Effects include:<br>• <strong>Polar bears</strong> — reduced hunting platforms<br>• <strong>Pacific walruses</strong> — overcrowding and stampedes on land<br>• <strong>Black guillemots</strong> — ice edge too far from nests, young birds starving</p></div>',
        vi: '<p>Nước là một trong ít chất <strong>ít đặc hơn ở dạng rắn so với lỏng</strong>. Nguyên nhân: liên kết hydro.</p><p><strong>Khi nước nguội:</strong></p><ul><li>Trên <strong>4°C</strong>: nước hành xử bình thường</li><li><strong>4°C</strong>: nước đạt mật độ tối đa</li><li>Dưới <strong>4°C xuống 0°C</strong>: phân tử chậm lại, nhiều H-bond ổn định hơn</li><li>Ở <strong>0°C</strong>: phân tử khóa vào <span class="kt">mạng tinh thể</span> — mỗi phân tử liên kết hydro với 4 phân tử</li></ul><div class="fb">Băng kém đặc hơn nước lỏng ở 4°C khoảng 10%</div><img src="images/ice_vs_liquid.png" alt="Tại sao Băng nổi" style="width:100%;border-radius:12px;margin:14px 0"><p><strong>Ý nghĩa sinh học:</strong> Băng nổi <strong>cách nhiệt cho nước bên dưới</strong>. Nếu băng đặc hơn và chìm, đại dương có thể đóng băng từ đáy lên.</p><div class="cbx"><h4><i class="fas fa-exclamation-triangle"></i> Biến đổi Khí hậu</h4><p>Nhiệt độ không khí Bắc Cực tăng <strong>2,2°C từ 1961</strong>. Ảnh hưởng:<br>• <strong>Gấu trắng</strong> — giảm nền tảng săn mồi<br>• <strong>Hải mã Thái Bình Dương</strong> — quá đông và giẫm đạp<br>• <strong>Chim guillemot đen</strong> — rìa băng quá xa tổ</p></div>' },
      { id: 'solvent', t: 'Water as the Universal Solvent', tv: 'Nước — Dung môi Phổ quát',
        en: '<p>Water is a versatile solvent due to its polarity. A <span class="kt">solution</span> is a homogeneous mixture; the dissolving agent is the <strong>solvent</strong>; the dissolved substance is the <strong>solute</strong>.</p><p><strong>How water dissolves ionic compounds (e.g., NaCl):</strong></p><ul><li>At the salt crystal surface, Na⁺ and Cl⁻ ions are exposed to water</li><li>The δ⁻ oxygen of water is attracted to Na⁺ cations</li><li>The δ⁺ hydrogens are attracted to Cl⁻ anions</li><li>Water molecules surround each ion, forming a <span class="kt">hydration shell</span></li><li>This shields ions from each other, separating and dissolving the crystal</li></ul><img src="images/hydration_shell.png" alt="Hydration Shells Around Na+ and Cl-" style="width:100%;border-radius:12px;margin:14px 0"><p><span class="kt">Hydrophilic</span> ("water-loving") = substances with affinity for water (ions, polar molecules). Cotton is hydrophilic but doesn\'t dissolve due to its giant molecular size.</p><p><span class="kt">Hydrophobic</span> ("water-fearing") = nonionic, nonpolar substances. Vegetable oil is hydrophobic — its C—H bonds are nonpolar. Cell membranes contain hydrophobic molecules.</p><p><strong>Measuring Concentration:</strong></p><div class="fb">Molecular mass: sum of atomic masses (in daltons)<br>Example: sucrose C₁₂H₂₂O₁₁ = (12×12) + (22×1) + (11×16) = 342 daltons</div><div class="fb">Mole (mol) = 6.02 × 10²³ molecules (Avogadro\'s number)<br>1 mole of sucrose = 342 grams</div><div class="fb">Molarity (M) = moles of solute per liter of solution<br>1 M sucrose = 342 g sucrose in 1 L solution</div>',
        vi: '<p>Nước là dung môi đa năng nhờ tính phân cực. <span class="kt">Dung dịch</span> là hỗn hợp đồng nhất; chất hòa tan là <strong>dung môi</strong>; chất bị hòa tan là <strong>chất tan</strong>.</p><p><strong>Nước hòa tan hợp chất ion (vd: NaCl):</strong></p><ul><li>Trên bề mặt tinh thể muối, Na⁺ và Cl⁻ tiếp xúc nước</li><li>δ⁻ oxy của nước bị hút bởi Na⁺</li><li>δ⁺ hydro bị hút bởi Cl⁻</li><li>Phân tử nước bao quanh mỗi ion, tạo <span class="kt">vỏ hydrat</span></li></ul><img src="images/hydration_shell.png" alt="Vỏ Hydrat quanh Na+ và Cl-" style="width:100%;border-radius:12px;margin:14px 0"><p><span class="kt">Thân nước</span> = chất có ái lực với nước. Bông thân nước nhưng không tan do kích thước phân tử khổng lồ.</p><p><span class="kt">Kỵ nước</span> = chất không ion, không cực. Dầu thực vật kỵ nước — liên kết C—H không cực. Màng tế bào chứa phân tử kỵ nước.</p><p><strong>Đo Nồng độ:</strong></p><div class="fb">Khối lượng phân tử: tổng khối lượng nguyên tử (dalton)<br>Ví dụ: sucrose C₁₂H₂₂O₁₁ = (12×12) + (22×1) + (11×16) = 342 dalton</div><div class="fb">Mol = 6,02 × 10²³ phân tử (số Avogadro)<br>1 mol sucrose = 342 gram</div><div class="fb">Nồng độ mol (M) = mol chất tan trên lít dung dịch<br>1 M sucrose = 342 g sucrose trong 1 L dung dịch</div>' },
      { id: 'acid', t: 'Acids, Bases, pH, and Buffers', tv: 'Axit, Bazơ, pH và Đệm',
        en: '<p><strong>Water self-ionization:</strong> Occasionally, an H⁺ transfers from one water molecule to another:</p><div class="fb">2H₂O ⇌ H₃O⁺ (hydronium) + OH⁻ (hydroxide)<br>[H⁺] × [OH⁻] = 10⁻¹⁴ at 25°C<br>In pure water: [H⁺] = [OH⁻] = 10⁻⁷ M</div><p><strong>Acids</strong> donate H⁺, increasing [H⁺]. Example: HCl → H⁺ + Cl⁻ (strong acid).</p><p><strong>Bases</strong> accept H⁺ or release OH⁻, decreasing [H⁺]. Example: NaOH → Na⁺ + OH⁻ (strong base). NH₃ + H⁺ → NH₄⁺ (weak base).</p><p><strong>Weak acids/bases</strong> reversibly release/accept H⁺. Example: H₂CO₃ ⇌ HCO₃⁻ + H⁺ (only 1% dissociated).</p><h4 style="color:var(--ac1);margin:16px 0 8px">The pH Scale</h4><div class="fb">pH = −log[H⁺]<br>Neutral (pure water) = pH 7<br>Acidic = pH &lt; 7 (more H⁺)<br>Basic = pH &gt; 7 (less H⁺)</div><p><strong>CRITICAL:</strong> Each pH unit = <strong>10-fold</strong> change in [H⁺]. pH 3 is 1,000× more acidic than pH 6.</p><img src="images/ph_scale.png" alt="The pH Scale with Examples" style="width:100%;border-radius:12px;margin:14px 0"><h4 style="color:var(--ac1);margin:16px 0 8px">Buffers</h4><p>A <span class="kt">buffer</span> minimizes pH changes by accepting excess H⁺ or donating H⁺ when depleted. Buffers consist of a <strong>weak acid-base pair</strong>.</p><p><strong>Blood buffer — carbonic acid/bicarbonate system:</strong></p><div class="fb">H₂CO₃ ⇌ HCO₃⁻ + H⁺<br>(acid) ⇌ (base) + (hydrogen ion)<br><br>pH drops → reaction shifts LEFT → HCO₃⁻ absorbs H⁺<br>pH rises → reaction shifts RIGHT → H₂CO₃ releases H⁺</div><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Critical Clinical Knowledge</h4><p>Human blood pH: <strong>7.35–7.45</strong>. A person cannot survive if blood pH drops to 7.0 or rises to 7.8. The carbonic acid–bicarbonate buffer system is the primary mechanism maintaining blood pH.</p></div><div class="cbx"><h4><i class="fas fa-exclamation-triangle"></i> Ocean Acidification</h4><p>~25% of human-generated CO₂ is absorbed by oceans. CO₂ + H₂O → H₂CO₃ → lowers ocean pH. Less CO₃²⁻ available for coral calcification. Ocean pH dropped 0.1 units — predicted to drop 0.3–0.5 more by 2100. Coral reefs severely threatened.</p></div>',
        vi: '<p><strong>Tự ion hóa nước:</strong> Đôi khi H⁺ truyền từ phân tử nước này sang phân tử khác:</p><div class="fb">2H₂O ⇌ H₃O⁺ (hydronium) + OH⁻ (hydroxide)<br>[H⁺] × [OH⁻] = 10⁻¹⁴ ở 25°C<br>Nước tinh khiết: [H⁺] = [OH⁻] = 10⁻⁷ M</div><p><strong>Axit</strong> cho H⁺, tăng [H⁺]. Ví dụ: HCl → H⁺ + Cl⁻ (axit mạnh).</p><p><strong>Bazơ</strong> nhận H⁺ hoặc giải phóng OH⁻, giảm [H⁺]. Ví dụ: NaOH → Na⁺ + OH⁻ (bazơ mạnh). NH₃ + H⁺ → NH₄⁺ (bazơ yếu).</p><p><strong>Axit/bazơ yếu</strong> thuận nghịch giải phóng/nhận H⁺. Ví dụ: H₂CO₃ ⇌ HCO₃⁻ + H⁺ (chỉ 1% phân ly).</p><h4 style="color:var(--ac1);margin:16px 0 8px">Thang pH</h4><div class="fb">pH = −log[H⁺]<br>Trung tính = pH 7<br>Axit = pH &lt; 7 | Bazơ = pH &gt; 7</div><p><strong>QUAN TRỌNG:</strong> Mỗi đơn vị pH = thay đổi <strong>10 lần</strong> [H⁺]. pH 3 axit hơn pH 6 gấp 1.000 lần.</p><img src="images/ph_scale.png" alt="Thang pH với Ví dụ" style="width:100%;border-radius:12px;margin:14px 0"><h4 style="color:var(--ac1);margin:16px 0 8px">Đệm</h4><p><span class="kt">Đệm</span> giảm thiểu thay đổi pH. Đệm gồm <strong>cặp axit-bazơ yếu</strong>.</p><p><strong>Đệm máu — hệ carbonic acid/bicarbonate:</strong></p><div class="fb">H₂CO₃ ⇌ HCO₃⁻ + H⁺<br><br>pH giảm → phản ứng dịch TRÁI → HCO₃⁻ hấp thụ H⁺<br>pH tăng → phản ứng dịch PHẢI → H₂CO₃ giải phóng H⁺</div><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Kiến thức Lâm sàng Trọng yếu</h4><p>pH máu: <strong>7,35–7,45</strong>. Không thể sống sót nếu pH máu giảm xuống 7,0 hoặc tăng lên 7,8.</p></div><div class="cbx"><h4><i class="fas fa-exclamation-triangle"></i> Axit hóa Đại dương</h4><p>~25% CO₂ do con người thải bị đại dương hấp thụ. CO₂ + H₂O → H₂CO₃ → giảm pH đại dương. Ít CO₃²⁻ cho san hô tạo vỏ. pH đại dương giảm 0,1 đơn vị — dự kiến giảm thêm 0,3–0,5 đến 2100.</p></div>' }
    ]},
    { id: 'ch4', t: 'Chapter 4: Carbon: The Basis of Molecular Diversity', tv: 'Chương 4: Cacbon: Nền tảng Đa dạng Phân tử', sec: [
      { id: 'org', t: 'Organic Chemistry and Origin of Life', tv: 'Hóa học Hữu cơ và Nguồn gốc Sự sống',
        en: '<p><span class="kt">Organic chemistry</span> is the study of carbon-containing compounds. Carbon is uniquely versatile because it has <strong>4 valence electrons</strong> and can form <strong>4 covalent bonds</strong>, acting as an intersection from which molecules branch in up to four directions.</p><p><strong>Miller\'s Experiment (1953):</strong></p><p>Stanley Miller, a graduate student of Harold Urey, simulated early Earth conditions to test whether organic molecules could form abiotically:</p><img src="images/miller_experiment.png" alt="Miller\'s Experiment Setup" style="width:100%;border-radius:12px;margin:14px 0"><div class="fb">Reactants: CH₄ (methane) + NH₃ (ammonia) + H₂O (water) + H₂ (hydrogen)<br>Energy source: electrical sparks (simulating lightning)<br>Result: AMINO ACIDS and other organic molecules formed!</div><p>This demonstrated that complex organic molecules can arise spontaneously under early Earth conditions — supporting the hypothesis of <strong>abiotic synthesis</strong> as an early stage in the origin of life.</p><p><strong>Life on Mars?</strong> In 2015, NASA found evidence of water flowing on Mars. In 2018, radar data revealed a large reservoir of liquid water one mile below the Martian surface.</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Why Carbon?</h4><p>The uniform composition of C, H, O, N, S, P across all organisms reflects <strong>common evolutionary origin</strong>. Carbon\'s ability to form 4 bonds and create chains, branches, and rings makes possible the enormous diversity of biological molecules.</p></div>',
        vi: '<p><span class="kt">Hóa học hữu cơ</span> nghiên cứu hợp chất chứa carbon. Carbon đa năng độc đáo vì có <strong>4 electron hóa trị</strong> và tạo <strong>4 liên kết cộng hóa trị</strong>.</p><p><strong>Thí nghiệm Miller (1953):</strong></p><p>Stanley Miller mô phỏng điều kiện Trái đất sơ khai để kiểm tra liệu phân tử hữu cơ có thể hình thành vô sinh:</p><img src="images/miller_experiment.png" alt="Thiết lập Thí nghiệm Miller" style="width:100%;border-radius:12px;margin:14px 0"><div class="fb">Chất phản ứng: CH₄ + NH₃ + H₂O + H₂<br>Nguồn năng lượng: tia lửa điện (mô phỏng sấm sét)<br>Kết quả: AXIT AMIN và phân tử hữu cơ khác hình thành!</div><p>Chứng minh phân tử hữu cơ phức tạp có thể hình thành tự phát — ủng hộ giả thuyết <strong>tổng hợp vô sinh</strong>.</p><p><strong>Sự sống trên sao Hỏa?</strong> 2015: NASA tìm bằng chứng nước chảy trên sao Hỏa. 2018: radar phát hiện hồ chứa nước lỏng lớn dưới bề mặt.</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Tại sao Carbon?</h4><p>Thành phần đồng nhất C, H, O, N, S, P qua mọi sinh vật phản ánh <strong>nguồn gốc tiến hóa chung</strong>. Khả năng tạo 4 liên kết cho phép đa dạng khổng lồ phân tử sinh học.</p></div>' },
      { id: 'cbond', t: 'Carbon Bonding and Isomers', tv: 'Liên kết Cacbon và Đồng phân',
        en: '<p>Carbon forms the basis of most organic molecules through varied <span class="kt">carbon skeletons</span> — chains, branches, and rings.</p><p><strong>Carbon skeleton variations:</strong></p><div class="fb">(a) Length: ethane (C₂H₆) vs propane (C₃H₈)<br>(b) Branching: butane (straight) vs isobutane (branched)<br>(c) Double bond position: 1-butene vs 2-butene<br>(d) Rings: cyclohexane, benzene</div><p><strong>Hydrocarbons</strong> = molecules with only C and H. They are nonpolar, hydrophobic, and energy-rich.</p><p><span class="kt">Isomers</span> are compounds with the <strong>same molecular formula but different structures</strong>. Three types:</p><p><strong>1. Structural isomers</strong> — differ in covalent bonding arrangement. C₅H₁₂ has 3 isomers; C₈H₁₈ has 18; C₂₀H₄₂ has 366,319!</p><p><strong>2. Cis-trans isomers</strong> — same bonds, different spatial arrangement around a <strong>double bond</strong>. Cis = same side; trans = opposite sides.</p><p><strong>3. Enantiomers</strong> — mirror images due to an <span class="kt">asymmetric carbon</span> (bonded to 4 different groups). Like left and right hands.</p><img src="images/isomers_types.png" alt="Three Types of Isomers" style="width:100%;border-radius:12px;margin:14px 0"><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Pharmacological Importance of Enantiomers</h4><p>Enantiomers can have dramatically different biological effects:<br>• <strong>Thalidomide:</strong> one enantiomer treats morning sickness; the other causes severe <strong>birth defects</strong><br>• <strong>Ibuprofen:</strong> S-form is <strong>100× more effective</strong> than R-form<br>• <strong>Albuterol</strong> (asthma): R-form relaxes airways; S-form <strong>counteracts</strong> the R-form<br>• <strong>L-dopa</strong> (Parkinson\'s): effective; D-dopa has <strong>no effect</strong><br><br>Modern pharmaceutical standards require single-enantiomer purity for many drugs.</p></div>',
        vi: '<p>Carbon tạo nền tảng hầu hết phân tử hữu cơ qua <span class="kt">bộ khung carbon</span> đa dạng — chuỗi, nhánh, vòng.</p><p><strong>Biến thể bộ khung carbon:</strong></p><div class="fb">(a) Chiều dài: ethane vs propane<br>(b) Phân nhánh: butane vs isobutane<br>(c) Vị trí liên kết đôi: 1-butene vs 2-butene<br>(d) Vòng: cyclohexane, benzene</div><p><strong>Hydrocarbon</strong> = phân tử chỉ có C và H. Không cực, kỵ nước, giàu năng lượng.</p><p><span class="kt">Đồng phân</span> = <strong>cùng công thức nhưng khác cấu trúc</strong>. Ba loại:</p><p><strong>1. Đồng phân cấu trúc</strong> — khác sắp xếp liên kết. C₅H₁₂ = 3; C₈H₁₈ = 18; C₂₀H₄₂ = 366.319!</p><p><strong>2. Đồng phân cis-trans</strong> — cùng liên kết, khác vị trí quanh <strong>liên kết đôi</strong>.</p><p><strong>3. Đối hình (enantiomer)</strong> — ảnh gương do <span class="kt">carbon bất đối xứng</span> (gắn 4 nhóm khác nhau).</p><img src="images/isomers_types.png" alt="Ba Loại Đồng phân" style="width:100%;border-radius:12px;margin:14px 0"><div class="cbx"><h4><i class="fas fa-heartbeat"></i> Ý nghĩa Dược lý</h4><p>Đối hình có tác dụng sinh học rất khác:<br>• <strong>Thalidomide:</strong> dạng này chữa ốm nghén; dạng kia gây <strong>dị tật bẩm sinh</strong><br>• <strong>Ibuprofen:</strong> dạng S hiệu quả <strong>gấp 100 lần</strong> dạng R<br>• <strong>Albuterol:</strong> dạng R giãn đường thở; dạng S <strong>chống lại</strong> dạng R<br>• <strong>L-dopa:</strong> hiệu quả; D-dopa <strong>không tác dụng</strong></p></div>' },
      { id: 'fgrp', t: 'Functional Groups', tv: 'Nhóm Chức năng',
        en: '<p>The distinctive properties of an organic molecule depend not only on its carbon skeleton but also on <span class="kt">chemical groups</span> attached to it. <strong>Functional groups</strong> participate directly in chemical reactions.</p><p><strong>Example — sex hormones:</strong> Estradiol (female) and testosterone (male) have the same 4-ring carbon skeleton but differ only in their attached chemical groups. These small differences produce profoundly different effects.</p><p><strong>Seven important biological chemical groups:</strong></p><img src="images/functional_groups.png" alt="Seven Important Functional Groups" style="width:100%;border-radius:12px;margin:14px 0"><div class="fb"><strong>—OH</strong> (Hydroxyl): polar, forms H-bonds → alcohols (ethanol)<br><strong>C═O</strong> (Carbonyl): ketones (within chain) or aldehydes (end of chain)<br><strong>—COOH</strong> (Carboxyl): acts as ACID — donates H⁺ → organic acids<br><strong>—NH₂</strong> (Amino): acts as BASE — accepts H⁺ → amines (amino acids)<br><strong>—SH</strong> (Sulfhydryl): forms disulfide bridges (S—S) in proteins<br><strong>—PO₄</strong> (Phosphate): negative charge, energy transfer → ATP, DNA<br><strong>—CH₃</strong> (Methyl): NOT reactive — affects gene expression and sex hormones</div><p><strong>Key observations:</strong></p><ul><li>The first 6 groups are <strong>chemically reactive</strong></li><li>All except —SH are <strong>hydrophilic</strong></li><li>—CH₃ is neither reactive nor hydrophilic — it acts as a <strong>recognition tag</strong></li></ul><h4 style="color:var(--ac1);margin:16px 0 8px">ATP: The Cell\'s Energy Currency</h4><p><span class="kt">ATP</span> (adenosine triphosphate) = adenosine + 3 phosphate groups. When ATP reacts with water:</p><div class="fb">ATP + H₂O → ADP + Pᵢ + Energy<br>(adenosine triphosphate → adenosine diphosphate + inorganic phosphate)</div><p>This reaction releases energy that powers cellular processes. ATP is the universal energy currency of cells.</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Medical Importance</h4><p>Functional groups are the basis of <strong>drug-receptor interactions</strong>. Phosphorylation (adding —PO₄) controls cell growth signaling — dysregulation leads to cancer.</p></div>',
        vi: '<p>Tính chất đặc biệt của phân tử hữu cơ phụ thuộc không chỉ bộ khung carbon mà còn <span class="kt">nhóm hóa học</span> gắn vào. <strong>Nhóm chức năng</strong> tham gia trực tiếp phản ứng.</p><p><strong>Ví dụ — hormone giới tính:</strong> Estradiol (nữ) và testosterone (nam) có cùng bộ khung 4 vòng carbon nhưng chỉ khác nhóm gắn vào.</p><p><strong>Bảy nhóm hóa học sinh học quan trọng:</strong></p><img src="images/functional_groups.png" alt="Bảy Nhóm Chức năng Quan trọng" style="width:100%;border-radius:12px;margin:14px 0"><div class="fb"><strong>—OH</strong> (Hydroxyl): cực, tạo H-bond → rượu (ethanol)<br><strong>C═O</strong> (Carbonyl): ketone hoặc aldehyde<br><strong>—COOH</strong> (Carboxyl): AXIT — cho H⁺<br><strong>—NH₂</strong> (Amino): BAZƠ — nhận H⁺<br><strong>—SH</strong> (Sulfhydryl): tạo cầu disulfide trong protein<br><strong>—PO₄</strong> (Phosphate): điện tích âm, truyền năng lượng → ATP, DNA<br><strong>—CH₃</strong> (Methyl): KHÔNG phản ứng — ảnh hưởng biểu hiện gen</div><p><strong>Nhận xét:</strong></p><ul><li>6 nhóm đầu <strong>hoạt động hóa học</strong></li><li>Tất cả trừ —SH đều <strong>thân nước</strong></li><li>—CH₃ đóng vai trò <strong>nhận dạng</strong></li></ul><h4 style="color:var(--ac1);margin:16px 0 8px">ATP: Tiền tệ Năng lượng Tế bào</h4><p><span class="kt">ATP</span> = adenosine + 3 nhóm phosphate. Khi ATP phản ứng với nước:</p><div class="fb">ATP + H₂O → ADP + Pᵢ + Năng lượng</div><p>Giải phóng năng lượng cho quá trình tế bào. ATP là tiền tệ năng lượng phổ quát.</p><div class="sbx"><h4><i class="fas fa-lightbulb"></i> Ý nghĩa Y khoa</h4><p>Nhóm chức năng là nền tảng <strong>tương tác thuốc-thụ thể</strong>. Phosphorylation kiểm soát tín hiệu tăng trưởng — rối loạn dẫn đến ung thư.</p></div>' }
    ]}
  ]}
];
